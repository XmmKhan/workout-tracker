<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Скриншот с эффектами</title>
<style>
:root {
  --bg: #E7E3EC;
  --amb-a: #ff2d95;
  --amb-b: #ff6a1a;
  --amb-c: #3a7bff;
  --amb-opacity: .55;
  --img-opacity: .7;

  --glass: rgba(26, 24, 30, .62);
  --glass-strong: rgba(20, 18, 24, .78);
  --stroke: rgba(255, 255, 255, .10);
  --hi: rgba(255, 255, 255, .08);
  --text: rgba(255, 255, 255, .94);
  --muted: rgba(255, 255, 255, .55);
  --faint: rgba(255, 255, 255, .28);
  --fill: rgba(255, 255, 255, .07);
  --fill-hover: rgba(255, 255, 255, .12);
  --active: rgba(255, 255, 255, .18);
  --primary-bg: rgba(255, 255, 255, .92);
  --primary-text: #1a1720;
  --checker: rgba(120, 110, 130, .16);
  --stage-text: rgba(30, 26, 36, .6);
  --drop: rgba(30, 26, 36, .35);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-bar: 22px;
  --r-pill: 999px;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121A;
    --amb-opacity: .38;
    --img-opacity: .42;
    --checker: rgba(255, 255, 255, .05);
    --stage-text: rgba(255, 255, 255, .55);
    --drop: rgba(255, 255, 255, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15121A;
  --amb-opacity: .38;
  --img-opacity: .42;
  --checker: rgba(255, 255, 255, .05);
  --stage-text: rgba(255, 255, 255, .55);
  --drop: rgba(255, 255, 255, .35);
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.35;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid rgba(255, 255, 255, .7); outline-offset: 2px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── Фон: размытая копия скриншота, как стекло поверх яркого контента ── */
.ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.ambient-base {
  position: absolute; inset: -20%;
  background:
    radial-gradient(38% 42% at 28% 72%, var(--amb-a), transparent 70%),
    radial-gradient(30% 34% at 52% 58%, var(--amb-b), transparent 70%),
    radial-gradient(34% 40% at 82% 22%, var(--amb-c), transparent 70%);
  filter: blur(70px);
  opacity: var(--amb-opacity);
}
.ambient-img {
  position: absolute; inset: -12%;
  background-size: cover; background-position: center;
  filter: blur(90px) saturate(1.6);
  opacity: 0;
  transition: opacity .7s ease;
}
.ambient-img.on { opacity: var(--img-opacity); }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--stroke);
  box-shadow: inset 0 1px 0 var(--hi), 0 14px 40px rgba(10, 6, 20, .28);
}

/* ── Каркас ── */
.app {
  position: relative; z-index: 1;
  height: 100%;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding: 12px;
}

/* ── Верхняя панель: параметры инструмента ── */
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 10px;
  min-height: 56px;
  padding: 8px 8px 8px 8px;
  border-radius: var(--r-bar);
}
.options {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 16px;
  overflow-x: auto; scrollbar-width: none;
  height: 40px; /* фиксированная высота: содержимое панели меняется, а холст не должен прыгать */
  padding: 0 6px;
  white-space: nowrap;
}
.options::-webkit-scrollbar { display: none; }
.opt-title { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
.opt-empty { color: var(--muted); }
.vsep { width: 1px; height: 22px; background: var(--stroke); flex: none; }

.ctl-slider { display: flex; align-items: center; gap: 10px; }
.ctl-label { color: var(--muted); }
.ctl-value { min-width: 38px; font-variant-numeric: tabular-nums; color: var(--text); }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 108px; height: 18px; background: transparent; margin: 0; cursor: pointer;
  --p: 50%;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px;
  background: linear-gradient(to right, rgba(255,255,255,.85) var(--p), rgba(255,255,255,.16) var(--p));
}
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: rgba(255,255,255,.85); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; margin-top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,.4);
}
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }

.seg { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--fill); }
.seg button { padding: 5px 12px; border-radius: var(--r-pill); color: var(--muted); transition: background .15s, color .15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--active); color: var(--text); }

.colors { display: flex; align-items: center; gap: 8px; }
.swatch {
  position: relative; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
  transition: transform .12s;
}
.swatch:hover { transform: scale(1.1); }
.swatch.on { box-shadow: 0 0 0 2px rgba(20,18,24,.9), 0 0 0 3.5px #fff; }
.swatch.custom { background: conic-gradient(from 0deg, #ff3b3b, #ffd23b, #3bff6e, #3bd5ff, #7a3bff, #ff3bd2, #ff3b3b); cursor: pointer; }
.swatch.custom.on { background: var(--c); }
.swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.note { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.note svg.i { width: 15px; height: 15px; }
.btn-icon.opt-del { width: 32px; height: 32px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-pill); background: var(--fill); }
.stepper button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; line-height: 1; }
.stepper button:hover:not(:disabled) { background: var(--fill-hover); }
.stepper button:disabled { color: var(--faint); }
.stepper .val { min-width: 26px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.next-num { color: var(--muted); }
.next-num b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.btn-icon.opt-del:hover { color: var(--text); }

.btn-pill {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: var(--r-pill);
  background: var(--fill); transition: background .15s;
  white-space: nowrap;
}
.btn-pill:hover { background: var(--fill-hover); }
.btn-pill.sm { height: 32px; padding: 0 14px; }
.crop-size { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
.opt-spacer { flex: 1; min-width: 8px; }
.btn-primary { background: var(--primary-bg); color: var(--primary-text); font-weight: 600; }
.btn-primary:hover { background: #fff; }
.btn-primary:disabled { background: var(--fill); color: var(--faint); }
.kbd { font-size: 12px; opacity: .55; font-weight: 500; }
.btn-icon {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--text); transition: background .15s, color .15s;
}
.btn-icon:hover:not(:disabled) { background: var(--fill-hover); }
.btn-icon:disabled { color: var(--faint); }
.actions { display: flex; align-items: center; gap: 4px; flex: none; }

/* ── Панель инструментов слева ── */
.rail {
  grid-column: 1; grid-row: 2;
  align-self: start;
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px;
  border-radius: 26px;
}
.tool {
  position: relative;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  color: var(--muted);
  transition: background .15s, color .15s;
}
.tool svg.i { width: 20px; height: 20px; }
.tool:hover:not(:disabled) { color: var(--text); background: var(--fill); }
.tool.on { color: var(--text); background: var(--active); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.tool:disabled { color: var(--faint); }
.tool .tip {
  position: absolute; left: calc(100% + 12px); top: 50%; transform: translate(-4px, -50%);
  display: flex; gap: 10px; align-items: center;
  padding: 7px 12px; border-radius: var(--r-pill);
  background: var(--glass-strong); border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  color: var(--text); white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .12s, transform .12s; z-index: 5;
}
.tool:hover .tip, .tool:focus-visible .tip { opacity: 1; transform: translate(0, -50%); }
.rail-sep { height: 1px; margin: 4px 8px; background: var(--stroke); }

/* ── Холст по центру ── */
.stage {
  grid-column: 2; grid-row: 2;
  position: relative;
  display: grid; place-items: center;
  min-height: 0; min-width: 0;
  border-radius: 28px;
  transition: box-shadow .15s;
}
.app.dragging .stage { box-shadow: inset 0 0 0 2px var(--drop); }
.stage { overflow: hidden; touch-action: none; z-index: 1; }
/* Панели всегда над холстом, иначе подсказки инструментов уходят под скриншот */
.topbar, .rail, .layers { position: relative; z-index: 5; }
.canvas-wrap { position: absolute; left: 0; top: 0; line-height: 0; will-change: transform; }
.stage.pan-ready canvas, .stage.pan-ready { cursor: grab !important; }
.stage.panning canvas, .stage.panning { cursor: grabbing !important; }
.zoom-ctl { display: flex; align-items: center; gap: 2px; margin: -4px -8px -4px 0; }
.zbtn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--text); font-size: 16px; line-height: 1; }
.zbtn:hover { background: var(--fill-hover); }
.zval { min-width: 48px; height: 26px; padding: 0 6px; border-radius: var(--r-pill); color: var(--muted); }
.zval:hover { background: var(--fill-hover); color: var(--text); }
canvas#canvas {
  display: block;
  touch-action: none;
  background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
  border-radius: 6px;
}
.text-draft {
  position: absolute; margin: 0; padding: 0; border: 0;
  background: transparent;
  outline: 1px dashed currentColor; outline-offset: 3px;
  resize: none; overflow: hidden; white-space: pre;
  display: block;
}
.text-draft::placeholder { color: currentColor; opacity: .45; }

.empty {
  width: min(400px, 100%);
  padding: 32px 28px 28px;
  border-radius: 28px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty-icon { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); margin-bottom: 6px; }
.empty-icon svg.i { width: 26px; height: 26px; }
.empty h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.empty p { margin: 0 0 12px; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 30ch; }

.status {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 24px);
  padding: 8px 16px; border-radius: var(--r-pill);
  color: var(--muted); font-size: 12.5px; white-space: nowrap;
}
.status #hint { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.status .vsep { height: 14px; }
.status .num { font-variant-numeric: tabular-nums; }

/* ── Слои справа ── */
.layers {
  grid-column: 3; grid-row: 2;
  align-self: start;
  width: 232px; max-height: 100%;
  display: flex; flex-direction: column;
  border-radius: var(--r-bar);
  overflow: hidden;
}
.layers-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; font-weight: 600; font-size: 13.5px; }
.layers-head .count { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.layers-list { list-style: none; margin: 0; padding: 0 6px 6px; overflow-y: auto; }
.layer {
  display: flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 6px 0 10px; border-radius: 12px;
}
.layer { cursor: pointer; }
.layer:hover { background: var(--fill); }
.layer.on { background: var(--active); }
.layer.base { cursor: default; }
.layer.base:hover { background: none; }
.layer .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.layer .dot.round { border-radius: 50%; }
.layer .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .del { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .12s; }
.layer .del svg.i { width: 15px; height: 15px; }
.layer:hover .del, .layer .del:focus-visible { opacity: 1; }
.layer .del:hover { color: var(--text); background: var(--fill-hover); }
.layer.base { color: var(--muted); }
.layers-empty { padding: 2px 16px 16px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px);
  transform: translate(-50%, -8px);
  padding: 9px 16px; border-radius: var(--r-pill); z-index: 10;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

[hidden] { display: none !important; }

@media (hover: none) { .layer .del { opacity: 1; } .tool .tip { display: none; } }

@media (max-width: 1080px) { .layers { display: none; } .app { grid-template-columns: auto minmax(0, 1fr); } }

@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 8px; }
  .topbar { flex-wrap: wrap; padding: 6px; }
  .options { order: 3; flex-basis: 100%; padding: 4px 6px 2px; }
  .actions { margin-left: auto; }
  .btn-pill .kbd { display: none; }
  .stage { grid-column: 1; grid-row: 2; }
  .rail { grid-column: 1; grid-row: 3; flex-direction: row; justify-self: center; align-self: center; }
  .rail-sep { width: 1px; height: auto; margin: 8px 2px; }
  .status #hint, .status #hint + .vsep { display: none; }
  .status { bottom: 6px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="ambient-base"></div>
  <div class="ambient-img" id="ambientImg"></div>
</div>

<div class="app" id="app">
  <header class="topbar glass">
    <button class="btn-pill" id="openBtn" title="Открыть изображение">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
      <span>Открыть</span>
    </button>
    <div class="vsep"></div>
    <div class="options" id="options"></div>
    <div class="actions">
      <button class="btn-icon" id="undoBtn" aria-label="Отменить"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn-icon" id="redoBtn" aria-label="Повторить"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn-icon" id="resetBtn" aria-label="Закрыть изображение и сбросить всё"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="btn-pill btn-primary" id="downloadBtn">
        <span>Скачать</span><span class="kbd" id="saveKbd"></span>
      </button>
    </div>
  </header>

  <nav class="rail glass" id="rail" aria-label="Инструменты"></nav>

  <main class="stage" id="stage">
    <div class="empty glass" id="empty">
      <div class="empty-icon"><svg class="i" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>
      <h1>Скриншот с эффектами</h1>
      <p id="emptyText">Перетащите изображение сюда или вставьте его из буфера</p>
      <button class="btn-pill btn-primary" id="emptyOpenBtn">Выбрать файл</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap" hidden>
      <canvas id="canvas"></canvas>
    </div>
    <div class="status glass" id="status" hidden>
      <span id="hint"></span>
      <span class="vsep"></span>
      <span class="zoom-ctl">
        <button class="zbtn" id="zoomOut" aria-label="Уменьшить">−</button>
        <button class="num zval" id="zoom"></button>
        <button class="zbtn" id="zoomIn" aria-label="Увеличить">+</button>
      </span>
      <span class="vsep"></span>
      <span class="num" id="dims"></span>
    </div>
  </main>

  <aside class="layers glass" id="layers" hidden>
    <div class="layers-head">
      <svg class="i" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
      Слои <span class="count" id="layerCount"></span>
    </div>
    <ul class="layers-list" id="layerList"></ul>
  </aside>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script>
(() => {
  // ─── Константы ────────────────────────────────────────────
  const PALETTE = ['#0ECE55', '#9FA5AD', '#24A8FB'];
  const SELECT_COLOR = '#24A8FB';
  const FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  const IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
  const MOD = IS_MAC ? '⌘' : 'Ctrl+';

  const svg = (inner) => `<svg class="i" viewBox="0 0 24 24">${inner}</svg>`;
  const ICONS = {
    select: svg('<path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/>'),
    crop: svg('<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>'),
    highlight: svg('<path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),

  const TOOLS = [
    { id: 'select',    label: 'Выбор',     key: 'V', code: 'KeyV', hint: 'Кликните по слою, чтобы выделить. Двойной клик по тексту — править' },

    { id: 'highlight', label: 'Подсветка', key: 'H', code: 'KeyH', hint: 'Выделите область, чтобы подсветить её' },

    { id: 'text',      label: 'Текст',     key: 'T', code: 'KeyT', hint: 'Кликните и пишите. Enter — готово, Shift+Enter — новая строка' },

  const TYPE_LABEL = { highlight: 'Подсветка', blur: 'Скрытие', focus: 'Фокус', arrow: 'Стрелка', box: 'Рамка', marker: 'Маркер', text: 'Текст' };
  const FX_DEFAULTS = { radius: 20, shadowBlur: 40, shadowOpacity: 0.3, padding: 60 };

  // ─── Состояние ────────────────────────────────────────────
  const S = {
    image: null,
    imageId: 0,
    mode: 'select',
    fx: { ...FX_DEFAULTS },
    highlight: { color: '#0ECE55', opacity: 0.4 },
    blur: { variant: 'pixelate', strength: 12 },
    focus: { tone: 'dark', opacity: 0.55, blur: 0, radius: 12 },
    arrow: { style: 'curved', bend: 0.3, color: '#0ECE55', thickness: 3 },
    box: { style: 'solid', color: '#0ECE55', thickness: 3, cornerRadius: 8 },
    marker: { style: 'filled', color: '#0ECE55', size: 22 },
    text: { variant: 'plain', color: '#0ECE55', size: 32, bold: true },
    annotations: [],
    undo: [],        // снимки списка слоёв до каждого действия
    redo: [],
    crop: null,       // область изображения после кадрирования { x, y, w, h } или null
    cropDraft: null,  // рамка, которую двигают в режиме кадрирования
    cropAspect: null,
    liveBase: null,  // снимок до начала непрерывной правки (перетаскивание, ползунок)
    selectedId: null,
    hiddenId: null,  // слой, который сейчас правится в поле ввода
    current: null,
    draft: null,

  let lastId = 0;
  const newId = () => ++lastId;

  const pct = (v) => Math.round(v * 100) + '%';
  const px = (v) => v + 'px';

  // Параметры: для инструмента по умолчанию и для выделенного слоя того же типа
  const OPTIONS = {
    fx: [
      { t: 'slider', key: 'radius', label: 'Скругление', min: 0, max: 100, fmt: px },
      { t: 'slider', key: 'shadowBlur', label: 'Тень', min: 0, max: 100, fmt: px },
      { t: 'slider', key: 'shadowOpacity', label: 'Плотность тени', min: 0, max: 1, step: 0.05, fmt: pct },
      { t: 'slider', key: 'padding', label: 'Отступы', min: 0, max: 200, fmt: px },
    ],
    highlight: [
      { t: 'color', key: 'color' },
