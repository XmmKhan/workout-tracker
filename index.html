    ],
    blur: [
      { t: 'seg', key: 'variant', options: [['pixelate', 'Пикселизация'], ['blur', 'Размытие']] },
      { t: 'slider', key: 'strength', label: (get) => (get('variant') === 'blur' ? 'Сила' : 'Размер пикселя'), min: 5, max: 30, fmt: px },
      { t: 'note', text: 'Для паролей и личных данных надёжнее пикселизация' },
    ],
    focus: [
      { t: 'seg', key: 'tone', options: [['dark', 'Тёмный'], ['light', 'Светлый']] },
      { t: 'slider', key: 'opacity', label: 'Затемнение', min: 0.1, max: 0.9, step: 0.05, fmt: pct },
      { t: 'slider', key: 'blur', label: 'Размытие фона', min: 0, max: 20, fmt: px },
      { t: 'slider', key: 'radius', label: 'Углы', min: 0, max: 60, fmt: px },
    ],
    arrow: [
      { t: 'seg', key: 'style', options: [['straight', 'Прямая'], ['curved', 'Кривая'], ['dotted', 'С точкой']] },
      { t: 'color', key: 'color' },
      { t: 'slider', key: 'bend', label: 'Изгиб', min: -1, max: 1, step: 0.05, fmt: pct, when: (get) => get('style') === 'curved' },
      { t: 'slider', key: 'thickness', label: 'Толщина', min: 2, max: 40, fmt: px },
    ],
    box: [
      { t: 'seg', key: 'style', options: [['solid', 'Сплошная'], ['dashed', 'Пунктир']] },
      { t: 'slider', key: 'cornerRadius', label: 'Скругление', min: 0, max: 60, fmt: px },
      { t: 'color', key: 'color' },
      { t: 'slider', key: 'thickness', label: 'Толщина', min: 1, max: 40, fmt: px },
    ],
    marker: [
      { t: 'stepper', key: 'num', label: 'Номер', layerOnly: true },
      { t: 'next', toolOnly: true },
      { t: 'seg', key: 'style', options: [['filled', 'Заливка'], ['outline', 'Контур']] },
      { t: 'color', key: 'color' },
      { t: 'slider', key: 'size', label: 'Размер', min: 10, max: 80, fmt: px },
    ],
    text: [
      { t: 'seg', key: 'variant', options: [['plain', 'Без фона'], ['label', 'Плашка'], ['callout', 'Выноска']] },
      { t: 'slider', key: 'size', label: 'Размер', min: 12, max: 120, fmt: px },
      { t: 'color', key: 'color' },
      { t: 'seg', key: 'bold', options: [[false, 'Обычный'], [true, 'Жирный']] },
    ],
  };

  // ─── DOM ──────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const app = $('app'), canvas = $('canvas'), ctx = canvas.getContext('2d');
  const stage = $('stage'), canvasWrap = $('canvasWrap'), fileInput = $('fileInput');

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };

  $('saveKbd').textContent = MOD + 'S';
  $('undoBtn').title = `Отменить (${MOD}Z)`;
  $('redoBtn').title = `Повторить (${IS_MAC ? '⇧⌘Z' : 'Ctrl+Y'})`;
  $('resetBtn').title = 'Сбросить всё';
  $('emptyText').textContent = `Перетащите изображение сюда или вставьте его из буфера (${MOD}V)`;

  // ─── Геометрия ────────────────────────────────────────────
  const toRect = (start, end) => ({
    x: Math.round(Math.min(start.x, end.x)),
    y: Math.round(Math.min(start.y, end.y)),
    width: Math.round(Math.abs(end.x - start.x)),
    height: Math.round(Math.abs(end.y - start.y)),
  });

  const roundRectPath = (c, x, y, w, h, radius) => {
    const r = Math.max(0, Math.min(radius, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  };

  const hexToRgba = (hex, a) => {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
  };

  const textFont = (size, bold) => `${bold ? 'bold ' : ''}${size}px ${FONT_FAMILY}`;

  // bend — сила дуги: смещение контрольной точки поперёк стрелки в долях её длины.
  // Знак выбирает сторону, 0 — прямая
  const DEFAULT_BEND = 0.3;
  const bendOf = (a) => (a.bend == null ? DEFAULT_BEND : a.bend);
  const curveControl = (start, end, bend = DEFAULT_BEND) => ({
    x: start.x + (end.x - start.x) / 2 - (end.y - start.y) * bend,
    y: start.y + (end.y - start.y) / 2 + (end.x - start.x) * bend,
  });
  // Точка на середине дуги — за неё тянут, чтобы менять изгиб
  const arrowMid = (a) => {
    const b = a.style === 'curved' ? bendOf(a) : 0;
    return bezierAt(a.start, curveControl(a.start, a.end, b), a.end, 0.5);
  };
  // Обратная задача: какой изгиб даст дугу, проходящую через точку p
  const bendFromPoint = (a, p) => {
    const dx = a.end.x - a.start.x, dy = a.end.y - a.start.y;
    const len2 = dx * dx + dy * dy;
    if (!len2) return 0;
    const mx = (a.start.x + a.end.x) / 2, my = (a.start.y + a.end.y) / 2;
    const b = (2 * ((p.x - mx) * -dy + (p.y - my) * dx)) / len2;
    return Math.max(-1.5, Math.min(1.5, Math.round(b * 100) / 100));
  };
  const bezierAt = (start, c, end, t) => ({
    x: (1 - t) ** 2 * start.x + 2 * (1 - t) * t * c.x + t * t * end.x,
    y: (1 - t) ** 2 * start.y + 2 * (1 - t) * t * c.y + t * t * end.y,
  });

  // ─── Отрисовка аннотаций ──────────────────────────────────
  const drawHighlight = (c, { start, end, color, opacity }) => {
    const { x, y, width, height } = toRect(start, end);
    c.fillStyle = hexToRgba(color, opacity);
    c.fillRect(x, y, width, height);
  };

  const drawBlur = (c, { start, end, strength, variant }) => {
    const { x, y, width, height } = toRect(start, end);
    if (width < 2 || height < 2) return;

    if (variant === 'pixelate') {
      const sw = Math.max(1, Math.ceil(width / strength));
      const sh = Math.max(1, Math.ceil(height / strength));
      const tmp = document.createElement('canvas');
      tmp.width = sw; tmp.height = sh;
      tmp.getContext('2d').drawImage(c.canvas, x, y, width, height, 0, 0, sw, sh);
      c.save();
      c.imageSmoothingEnabled = false;
      c.drawImage(tmp, 0, 0, sw, sh, x, y, width, height);
      c.restore();
      return;
    }

    // Берём область с запасом, чтобы по краям не было светлой каймы
    const margin = strength * 2;
    const sx = Math.max(0, x - margin), sy = Math.max(0, y - margin);
    const sw = Math.min(c.canvas.width, x + width + margin) - sx;
    const sh = Math.min(c.canvas.height, y + height + margin) - sy;
    if (sw <= 0 || sh <= 0) return;
    const snap = document.createElement('canvas');
    snap.width = sw; snap.height = sh;
    snap.getContext('2d').drawImage(c.canvas, sx, sy, sw, sh, 0, 0, sw, sh);
    c.save();
    c.beginPath();
    c.rect(x, y, width, height);
    c.clip();
    c.filter = `blur(${strength}px)`;
    c.drawImage(snap, sx, sy);
    c.restore();
  };

  const drawBox = (c, { start, end, color, thickness, style, cornerRadius }) => {
    const { x, y, width, height } = toRect(start, end);
    c.save();
    c.strokeStyle = color;
    c.lineWidth = thickness;
    c.lineCap = 'round';
    c.lineJoin = 'round';
    // Шаг пунктира растёт с толщиной; с круглыми концами штрих визуально длиннее на толщину
    c.setLineDash(style === 'dashed' ? [Math.max(4, thickness * 2.5), thickness + Math.max(5, thickness * 1.5)] : []);
    roundRectPath(c, x, y, width, height, cornerRadius || 0);
    c.stroke();
    c.restore();
  };

  const drawArrowHead = (c, end, angle, len) => {
    c.beginPath();
    c.moveTo(end.x, end.y);
    c.lineTo(end.x - len * Math.cos(angle - Math.PI / 6), end.y - len * Math.sin(angle - Math.PI / 6));
    c.lineTo(end.x - len * Math.cos(angle + Math.PI / 6), end.y - len * Math.sin(angle + Math.PI / 6));
    c.closePath();
    c.fill();
  };

  const headLength = (thickness) => 15 + thickness * 2;

  const drawArrow = (c, { start, end, color, thickness, style, bend }) => {
    const dx = end.x - start.x, dy = end.y - start.y;
    const distance = Math.hypot(dx, dy);
    if (distance < 2) return;
    const headLen = headLength(thickness);

    c.save();
    c.strokeStyle = color;
    c.fillStyle = color;
    c.lineWidth = thickness;
    c.lineCap = 'round';
    c.lineJoin = 'round';

    if (style === 'curved') {
      const cp = curveControl(start, end, bend == null ? DEFAULT_BEND : bend);
      const before = bezierAt(start, cp, end, 0.99);
      const angle = Math.atan2(end.y - before.y, end.x - before.x);
      const lineEnd = bezierAt(start, cp, end, Math.max(0, 1 - (headLen * 0.6) / distance));
      c.beginPath();
      c.moveTo(start.x, start.y);
      c.quadraticCurveTo(cp.x, cp.y, lineEnd.x, lineEnd.y);
      c.stroke();
      drawArrowHead(c, end, angle, headLen);
    } else {
      const angle = Math.atan2(dy, dx);
      let from = start;
      if (style === 'dotted') {
        const dotR = 5 + thickness;
        c.beginPath();
        c.arc(start.x, start.y, dotR, 0, Math.PI * 2);
        c.fill();
        from = { x: start.x + dotR * Math.cos(angle), y: start.y + dotR * Math.sin(angle) };
      }
      c.beginPath();
      c.moveTo(from.x, from.y);
      c.lineTo(end.x - headLen * 0.5 * Math.cos(angle), end.y - headLen * 0.5 * Math.sin(angle));
      c.stroke();
      drawArrowHead(c, end, angle, headLen);
    }
    c.restore();
  };

  // ─── Текст: обычный, плашка, выноска ──────────────────────
  const LINE = 1.2; // межстрочный интервал относительно кегля

  const textMetrics = (a) => {
    ctx.save();
    ctx.font = textFont(a.size, a.bold);
    const lines = String(a.text).split('\n');
    const w = Math.max(0, ...lines.map((l) => ctx.measureText(l).width));
    ctx.restore();
    const lh = a.size * LINE;
    return { lines, w, lh, h: (lines.length - 1) * lh + a.size * 1.15 };
  };

  const platePad = (a) => ({ px: a.size * 0.55, py: a.size * 0.38, r: a.size * 0.42 });
  const hasPlate = (a) => a.variant === 'label' || a.variant === 'callout';

  const plateRect = (a, m = textMetrics(a)) => {
    const { px, py } = platePad(a);
    return { x: a.x - px, y: a.y - py, width: m.w + px * 2, height: m.h + py * 2 };
  };

  // Кончик хвоста выноски; если его ещё не двигали — под плашкой слева
  const tailOf = (a) => {
    if (a.tail) return a.tail;
    const r = plateRect(a);
    return { x: r.x + Math.min(r.width * 0.25, a.size * 2), y: r.y + r.height + a.size * 1.3 };
  };

  // Треугольник хвоста: основание на ближайшей к кончику стороне плашки
  function tailTriangle(r, tip, size, radius) {
    const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, v)));
    let side;
    if (tip.y > r.y + r.height) side = 'bottom';
    else if (tip.y < r.y) side = 'top';
    else side = tip.x < r.x ? 'left' : 'right';
    const horizontal = side === 'top' || side === 'bottom';
    const len = horizontal ? r.width : r.height;
    const half = Math.min(size * 0.55, len * 0.3);
    const inset = 1.5; // основание чуть внутри плашки, чтобы не было шва
    if (horizontal) {
      const cx = clamp(tip.x, r.x + radius + half, r.x + r.width - radius - half);
      const y = side === 'bottom' ? r.y + r.height - inset : r.y + inset;
      return [{ x: cx - half, y }, { x: cx + half, y }, tip];
    }
    const cy = clamp(tip.y, r.y + radius + half, r.y + r.height - radius - half);
    const x = side === 'right' ? r.x + r.width - inset : r.x + inset;
    return [{ x, y: cy - half }, { x, y: cy + half }, tip];
  }

  const drawText = (c, a) => {
    const m = textMetrics(a);
    c.save();
    let ink = a.color;
    if (hasPlate(a)) {
      const r = plateRect(a, m);
      const { r: radius } = platePad(a);
      roundRectPath(c, r.x, r.y, r.width, r.height, radius);
      if (a.variant === 'callout') {
        let tri = tailTriangle(r, tailOf(a), a.size, radius);
        // Направление обхода как у плашки, иначе при заливке место стыка станет дыркой
        const area = (tri[1].x - tri[0].x) * (tri[2].y - tri[0].y) - (tri[2].x - tri[0].x) * (tri[1].y - tri[0].y);
        if (area < 0) tri = [tri[1], tri[0], tri[2]];
        c.moveTo(tri[0].x, tri[0].y);
        c.lineTo(tri[1].x, tri[1].y);
        c.lineTo(tri[2].x, tri[2].y);
        c.closePath();
      }
      c.shadowColor = 'rgba(0, 0, 0, 0.25)';
      c.shadowBlur = a.size * 0.5;
      c.shadowOffsetY = a.size * 0.12;
      c.fillStyle = a.color;
      c.fill('nonzero');
      c.shadowColor = 'transparent';
      ink = readableOn(a.color);
    }
    c.font = textFont(a.size, a.bold);
    c.fillStyle = ink;
    c.textBaseline = 'top';
    m.lines.forEach((line, i) => c.fillText(line, a.x, a.y + i * m.lh));
    c.restore();
  };

  // Фокус: все области фокуса рисуются одним слоем, чтобы пересекающиеся
  // или соседние области не затемняли друг друга. Затемняется только сам скриншот
  function drawFocus(c, list) {
    if (!list.length) return;
    const f = list[0];
    const W = c.canvas.width, H = c.canvas.height;
    const { padding, radius } = S.fx;
    const { w: iw, h: ih } = region();

    const cutHoles = (x) => {
      x.globalCompositeOperation = 'destination-out';
      x.fillStyle = '#000';
      list.forEach((a) => {
        const r = toRect(a.start, a.end);
        if (r.width < 2 || r.height < 2) return;
        roundRectPath(x, r.x, r.y, r.width, r.height, a.radius);
        x.fill();
      });
      x.globalCompositeOperation = 'source-over';
    };
    const layer = () => {
      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      return cv;
    };

    if (f.blur > 0) {
      const b = layer(), bc = b.getContext('2d');
      roundRectPath(bc, padding, padding, iw, ih, radius);
      bc.clip();
      bc.filter = `blur(${f.blur}px)`;
      bc.drawImage(c.canvas, 0, 0);
      bc.filter = 'none';
      cutHoles(bc);
      c.drawImage(b, 0, 0);
    }

    const d = layer(), dc = d.getContext('2d');
    dc.fillStyle = f.tone === 'light' ? `rgba(255, 255, 255, ${f.opacity})` : `rgba(12, 10, 16, ${f.opacity})`;
    roundRectPath(dc, padding, padding, iw, ih, radius);
    dc.fill();
    cutHoles(dc);
    c.drawImage(d, 0, 0);
  }

  // Контрастный цвет цифры: тёмный на светлой заливке, белый на тёмной
  const readableOn = (hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.62 ? '#16141a' : '#ffffff';
  };

  const drawMarker = (c, { x, y, num, color, size, style }) => {
    const label = String(num);
    c.save();
    c.beginPath();
    c.arc(x, y, size, 0, Math.PI * 2);
    c.shadowColor = 'rgba(0, 0, 0, 0.28)';
    c.shadowBlur = size * 0.35;
    c.shadowOffsetY = size * 0.1;
    if (style === 'outline') {
      c.fillStyle = '#ffffff';
      c.fill();
      c.shadowColor = 'transparent';
      c.lineWidth = Math.max(2, size * 0.16);
      c.strokeStyle = color;
      c.stroke();
      c.fillStyle = color;
    } else {
      c.fillStyle = color;
      c.fill();
      c.shadowColor = 'transparent';
      c.fillStyle = readableOn(color);
    }
    const fontSize = size * (label.length > 1 ? 0.92 : 1.12);
    c.font = textFont(fontSize, true);
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(label, x, y + size * 0.05);
    c.restore();
  };

  const DRAW = { highlight: drawHighlight, blur: drawBlur, box: drawBox, arrow: drawArrow, marker: drawMarker, text: drawText };
  const drawAnnotation = (c, a) => DRAW[a.type] && DRAW[a.type](c, a);

  // ─── Попадание по слоям ───────────────────────────────────
  const textBox = (a) => {
    const m = textMetrics(a);
    return hasPlate(a) ? plateRect(a, m) : { x: a.x, y: a.y, width: m.w, height: m.h };
  };

  const inRect = (r, p, t = 0) =>
    p.x >= r.x - t && p.x <= r.x + r.width + t && p.y >= r.y - t && p.y <= r.y + r.height + t;

  const distToSeg = (p, a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = dx * dx + dy * dy;
    const t = len ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len)) : 0;
    return Math.hypot(p.x - a.x - t * dx, p.y - a.y - t * dy);
  };

  const arrowPath = (a) => {
    if (a.style !== 'curved') return [a.start, a.end];
    const cp = curveControl(a.start, a.end, bendOf(a));
    return Array.from({ length: 25 }, (_, i) => bezierAt(a.start, cp, a.end, i / 24));
  };

  function hitLayer(a, p, tol) {
    switch (a.type) {
      case 'highlight':
      case 'blur':
      case 'focus':
        return inRect(toRect(a.start, a.end), p, tol);
      case 'box': {
        // Рамку берём только за контур, чтобы клики внутри доходили до того, что в ней
        const r = toRect(a.start, a.end);
        const t = tol + a.thickness / 2;
        const inner = { x: r.x + t, y: r.y + t, width: r.width - 2 * t, height: r.height - 2 * t };
        return inRect(r, p, t) && !(inner.width > 0 && inner.height > 0 && inRect(inner, p));
      }
      case 'arrow': {
        const pts = arrowPath(a);
        const reach = tol + a.thickness / 2;
        for (let i = 1; i < pts.length; i++) if (distToSeg(p, pts[i - 1], pts[i]) <= reach) return true;
        return Math.hypot(p.x - a.end.x, p.y - a.end.y) <= headLength(a.thickness) + tol;
      }
      case 'text':
        return inRect(textBox(a), p, tol);
      case 'marker':
        return Math.hypot(p.x - a.x, p.y - a.y) <= a.size + tol;
      default:
        return false;
    }
  }

  const hitTest = (p, tol, filter = () => true) => {
    for (let i = S.annotations.length - 1; i >= 0; i--) {
      const a = S.annotations[i];
      if (a.id !== S.hiddenId && filter(a) && hitLayer(a, p, tol)) return a;
    }
    return null;
  };

  function handlesOf(a) {
    if (a.type === 'arrow') {
      const hs = [{ id: 'start', ...a.start }, { id: 'end', ...a.end }];
      // Ручка изгиба: у кривой и у прямой (потянув её, прямую можно изогнуть)
      if (a.style !== 'dotted') hs.push({ id: 'mid', ...arrowMid(a), small: true });
      return hs;
    }
    if (a.type === 'text') return a.variant === 'callout' ? [{ id: 'tail', ...tailOf(a) }] : [];
    if (a.type === 'marker') return [];
    const r = toRect(a.start, a.end);
    return [
      { id: 'nw', x: r.x, y: r.y },
      { id: 'ne', x: r.x + r.width, y: r.y },
      { id: 'sw', x: r.x, y: r.y + r.height },
      { id: 'se', x: r.x + r.width, y: r.y + r.height },
    ];
  }

  const hitHandle = (a, p, tol) =>
    handlesOf(a).find((h) => Math.hypot(p.x - h.x, p.y - h.y) <= tol * 1.5) || null;

  const HANDLE_CURSOR = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', start: 'move', end: 'move', tail: 'move', mid: 'grab' };

  // Сдвиг слоя на dx, dy относительно исходного состояния
  const translated = (a, dx, dy) =>
    a.type === 'text' || a.type === 'marker'
      ? { x: a.x + dx, y: a.y + dy, ...(a.tail ? { tail: { x: a.tail.x + dx, y: a.tail.y + dy } } : {}) }
      : { start: { x: a.start.x + dx, y: a.start.y + dy }, end: { x: a.end.x + dx, y: a.end.y + dy } };

  // Тянем угол прямоугольника: противоположный угол остаётся на месте
  function resizedRect(orig, handle, p) {
    const r = toRect(orig.start, orig.end);
    const fixed = {
      nw: { x: r.x + r.width, y: r.y + r.height },
      ne: { x: r.x, y: r.y + r.height },
      sw: { x: r.x + r.width, y: r.y },
      se: { x: r.x, y: r.y },
    }[handle];
    return { start: fixed, end: { x: p.x, y: p.y } };
  }

  // Новый маркер получает номер на единицу больше максимального
  const nextMarkerNum = () =>
    S.annotations.reduce((m, a) => (a.type === 'marker' ? Math.max(m, a.num) : m), 0) + 1;

  // ─── Выделение ────────────────────────────────────────────
  const selected = () => (S.selectedId == null ? null : S.annotations.find((a) => a.id === S.selectedId) || null);

  function select(id) {
    if (S.selectedId === id || S.mode === 'crop') return;
    S.selectedId = id;
    redraw();
    renderLayers();
    renderOptions();
    updateStatus();
  }
  const deselect = () => select(null);

  function drawSelection(c) {
    const a = selected();
    if (!a || a.id === S.hiddenId) return;
    const z = V.zoom || 1;
    c.save();
    c.strokeStyle = SELECT_COLOR;
    c.lineWidth = 1.5 / z;
    if (a.type !== 'arrow') {
      const r = a.type === 'text' ? textBox(a)
        : a.type === 'marker' ? { x: a.x - a.size, y: a.y - a.size, width: a.size * 2, height: a.size * 2 }
        : toRect(a.start, a.end);
      const pad = (a.type === 'box' ? a.thickness / 2 : 0) + 3 / z;
      c.setLineDash(a.type === 'text' ? [4 / z, 3 / z] : []);
      c.strokeRect(r.x - pad, r.y - pad, r.width + pad * 2, r.height + pad * 2);
      c.setLineDash([]);
    }
    handlesOf(a).forEach((h) => {
      c.beginPath();
      c.arc(h.x, h.y, (h.small ? 4.5 : 5.5) / z, 0, Math.PI * 2);
      c.fillStyle = h.small ? SELECT_COLOR : '#fff'; // ручка изгиба — синяя, чтобы не путать с концами
      c.fill();
      c.strokeStyle = h.small ? '#fff' : SELECT_COLOR;
      c.stroke();
    });
    c.restore();
  }

  // ─── Холст ────────────────────────────────────────────────
  // Какая часть исходного изображения сейчас на холсте. В режиме кадрирования
  // показываем всё изображение, чтобы рамку можно было и расширить
  const fullRegion = () => ({ x: 0, y: 0, w: S.image.naturalWidth, h: S.image.naturalHeight });
  const region = () => (S.mode === 'crop' || !S.crop ? fullRegion() : S.crop);
  // Слои хранятся в координатах кадрированного холста; в режиме кадрирования сдвигаем их
  const annotationOffset = () => (S.mode === 'crop' && S.crop ? { x: S.crop.x, y: S.crop.y } : { x: 0, y: 0 });

  let rounded = { key: null, canvas: null };
  const getRoundedImage = () => {
    const r = region();
    const key = `${S.imageId}|${S.fx.radius}|${r.x},${r.y},${r.w},${r.h}`;
    if (rounded.key !== key) {
      const c = document.createElement('canvas');
      c.width = r.w;
      c.height = r.h;
      const t = c.getContext('2d');
      roundRectPath(t, 0, 0, c.width, c.height, S.fx.radius);
      t.clip();
      t.drawImage(S.image, r.x, r.y, r.w, r.h, 0, 0, r.w, r.h);
      rounded = { key, canvas: c };
    }
    return rounded.canvas;
  };

  // Рисует итоговое изображение (без рамки выделения) в любой контекст
  function paint(c, withCurrent) {
    const { padding, shadowBlur, shadowOpacity } = S.fx;
    c.save();
    c.shadowColor = `rgba(0, 0, 0, ${shadowOpacity})`;
    c.shadowBlur = shadowBlur;
    c.shadowOffsetX = 0;
    c.shadowOffsetY = shadowBlur / 4;
    c.drawImage(getRoundedImage(), padding, padding);
    c.restore();
    const cur = withCurrent ? S.current : null;
    const o = annotationOffset();
    const shift = (a) => (o.x || o.y ? { ...a, ...translated(a, o.x, o.y) } : a);
    const layers = S.annotations.filter((a) => a.id !== S.hiddenId).map(shift);
    const focuses = layers.filter((a) => a.type === 'focus');
    if (cur && cur.type === 'focus') focuses.push(cur);
    let focusDone = false;
    for (const a of layers) {
      if (a.type === 'focus') {
        if (!focusDone) { drawFocus(c, focuses); focusDone = true; }
        continue;
      }
      drawAnnotation(c, a);
    }
    if (cur) {
      if (cur.type !== 'focus') drawAnnotation(c, cur);
      else if (!focusDone) drawFocus(c, focuses);
    }
  }

  const exportSize = () => ({
    w: region().w + S.fx.padding * 2,
    h: region().h + S.fx.padding * 2,
  });

  function redraw() {
    if (!S.image) return;
    const { w, h } = exportSize();
    const resized = canvas.width !== w || canvas.height !== h;
    if (resized) { canvas.width = w; canvas.height = h; } else ctx.clearRect(0, 0, w, h);
    paint(ctx, true);
    if (S.mode === 'crop') drawCropOverlay(ctx);
    else drawSelection(ctx);
    if (resized) fit();
  }

  let rafId = 0;
  const scheduleRedraw = () => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => { rafId = 0; redraw(); });
  };

  // ─── Вид: масштаб и сдвиг ─────────────────────────────────
  const V = { zoom: 1, x: 0, y: 0, fitted: true };
  const ZMIN = 0.05, ZMAX = 8;
  const clampZoom = (z) => Math.min(ZMAX, Math.max(ZMIN, z));
  const statusRoom = () => ($('status').offsetParent ? 64 : 16);

  function applyView() {
    const zoomChanged = S.scale !== V.zoom;
    S.scale = V.zoom;
    canvas.style.width = canvas.width * V.zoom + 'px';
    canvas.style.height = canvas.height * V.zoom + 'px';
    canvasWrap.style.transform = `translate(${Math.round(V.x)}px, ${Math.round(V.y)}px)`;
    if (S.draft) positionDraft(S.draft);
    if (zoomChanged && S.selectedId != null) scheduleRedraw(); // ручки выделения всегда одного экранного размера
    updateStatus();
  }

  // Вписывает холст, пока пользователь сам не менял масштаб или положение
  function fit() {
    if (!S.image) return;
    if (!V.fitted) { applyView(); return; }
    const r = stage.getBoundingClientRect();
    const room = statusRoom();
    const aw = Math.max(40, r.width - 48);
    const ah = Math.max(40, r.height - 24 - room);
    V.zoom = Math.min(1, aw / canvas.width, ah / canvas.height) || 1;
    V.x = (r.width - canvas.width * V.zoom) / 2;
    V.y = (r.height - room + 16 - canvas.height * V.zoom) / 2;
    applyView();
  }
  new ResizeObserver(fit).observe(stage);

  const fitView = () => { V.fitted = true; fit(); };

  function zoomTo(nz, cx, cy) {
    if (!S.image) return;
    const r = stage.getBoundingClientRect();
    if (cx == null) { cx = r.width / 2; cy = (r.height - statusRoom() + 16) / 2; }
    nz = clampZoom(nz);
    V.x = cx - (cx - V.x) * (nz / V.zoom);
    V.y = cy - (cy - V.y) * (nz / V.zoom);
    V.zoom = nz;
    V.fitted = false;
    applyView();
  }
  const zoomStep = (dir, cx, cy) => zoomTo(V.zoom * (dir > 0 ? 1.25 : 0.8), cx, cy);

  function updateStatus() {
    const sel = selected();
    const tool = TOOLS.find((t) => t.id === S.mode);
    $('hint').textContent = sel
      ? 'Тяните слой или его углы. Delete удаляет, Esc снимает выделение'
      : tool.hint;
    $('zoom').textContent = Math.round(S.scale * 100) + '%';
    $('zoom').title = `Вписать в окно (${MOD}0)`;
    $('dims').textContent = S.image ? `${canvas.width} × ${canvas.height}` : '';
  }

  // ─── История ──────────────────────────────────────────────
  // Любое изменение слоёв идёт через commit: сохраняем снимок «до»,
  // чтобы отменялось само действие — добавление, удаление, правка
  const HISTORY_LIMIT = 200;

  // Запись истории: слои и кадрирование вместе, чтобы отмена кадрирования
  // возвращала и слои на их места
  function pushHistory(annotations) {
    S.undo.push({ annotations, crop: S.crop });
    if (S.undo.length > HISTORY_LIMIT) S.undo.shift();
    S.redo = [];
  }

  function commit(update) {
    endLiveEdit();
    const next = update(S.annotations);
    if (next === S.annotations) return;
    pushHistory(S.annotations);
    S.annotations = next;
    changed();
  }

  // Непрерывная правка (перетаскивание, ползунок): много промежуточных
  // состояний, но в историю попадает одно действие
  function liveEdit(target, patch) {
    if (!S.liveBase) S.liveBase = S.annotations;
    const match = typeof target === 'function' ? target : (a) => a.id === target;
    S.annotations = S.annotations.map((a) => (match(a) ? { ...a, ...patch } : a));
    scheduleRedraw();
  }

  function endLiveEdit() {
    const base = S.liveBase;
    if (!base) return;
    S.liveBase = null;
    if (base !== S.annotations) { pushHistory(base); changed(); }
  }

  const pushAnnotation = (a) => commit((list) => [...list, a]);

  function restore(from, to) {
    endLiveEdit();
    if (S.mode === 'crop') cancelCrop();
    if (!from.length) return;
    to.push({ annotations: S.annotations, crop: S.crop });
    const e = from.pop();
    const cropChanged = e.crop !== S.crop;
    S.annotations = e.annotations;
    S.crop = e.crop;
    changed();
    if (cropChanged) fitView();
  }
  const undo = () => restore(S.undo, S.redo);
  const redo = () => restore(S.redo, S.undo);

  function deleteSelected() {
    const id = S.selectedId;
    if (id == null) return;
    S.selectedId = null;
    commit((list) => list.filter((a) => a.id !== id));
  }

  function duplicateSelected() {
    const a = selected();
    if (!a) return;
    const copy = { ...a, ...translated(a, 20, 20), id: newId() };
    S.selectedId = copy.id;
    commit((list) => {
      const i = list.findIndex((x) => x.id === a.id);
      return [...list.slice(0, i + 1), copy, ...list.slice(i + 1)];
    });
  }

  function changed() {
    if (S.selectedId != null && !selected()) S.selectedId = null; // слой мог исчезнуть после отмены
    redraw();
    renderLayers();
    renderOptions(false);
    updateButtons();
    updateStatus();
  }

  // ─── Панель инструментов ──────────────────────────────────
  function renderRail() {
    const rail = $('rail');
    rail.textContent = '';
    TOOLS.forEach((t, i) => {
      if (i === 2) rail.append(el('div', 'rail-sep'));
      const b = el('button', 'tool' + (S.mode === t.id ? ' on' : ''));
      b.innerHTML = ICONS[t.id];
      b.setAttribute('aria-label', `${t.label} (${t.key})`);
      b.setAttribute('aria-pressed', S.mode === t.id);
      b.disabled = !S.image;
      const tip = el('span', 'tip');
      tip.append(el('span', null, t.label), el('span', 'kbd', t.key));
      b.append(tip);
      b.addEventListener('click', () => switchMode(t.id));
      rail.append(b);
    });
  }

  // ─── Верхняя панель параметров ────────────────────────────
  // Цель правки: выделенный слой, настройки инструмента или оформление
  function optionsTarget() {
    const sel = selected();
    if (sel) {
      return {
        title: TYPE_LABEL[sel.type],
        type: sel.type,
        layer: true,
        get: (k) => (selected() || sel)[k],
        set: (k, v, final) => {
          if (k !== 'num') S[sel.type][k] = v; // следующие слои этого типа будут такими же
          if (S.draft && S.draft.editId === sel.id) { S.draft[k] = v; positionDraft(S.draft); }
          // Затемнение, тон и размытие общие для всех областей фокуса
          const shared = sel.type === 'focus' && ['tone', 'opacity', 'blur'].includes(k);
          liveEdit(shared ? (a) => a.type === 'focus' : sel.id, { [k]: v });
          if (final) endLiveEdit();
        },
      };
    }
    if (S.mode === 'select') {
      return {
        title: 'Оформление', type: 'fx',
        get: (k) => S.fx[k],
        set: (k, v) => { S.fx[k] = v; scheduleRedraw(); },
      };
    }
    const tool = TOOLS.find((t) => t.id === S.mode);
    return {
      title: tool.label, type: S.mode,
      get: (k) => S[S.mode][k],
      set: (k, v) => {
        S[S.mode][k] = v;
        if (S.mode === 'text' && S.draft) { S.draft[k] = v; positionDraft(S.draft); }
      },
    };
  }

  function buildSlider(c, T) {
    const wrap = el('label', 'ctl-slider');
    const label = typeof c.label === 'function' ? c.label(T.get) : c.label;
    const input = document.createElement('input');
    input.type = 'range';
    input.min = c.min; input.max = c.max; input.step = c.step || 1;
    input.value = T.get(c.key);
    input.setAttribute('aria-label', label);
    const val = el('span', 'ctl-value', c.fmt(T.get(c.key)));
    const fill = () => input.style.setProperty('--p', ((input.value - c.min) / (c.max - c.min)) * 100 + '%');
    fill();
    input.addEventListener('input', () => {
      const v = Number(input.value);
      T.set(c.key, v, false);
      val.textContent = c.fmt(v);
      fill();
    });
    input.addEventListener('change', () => T.set(c.key, Number(input.value), true));
    wrap.append(el('span', 'ctl-label', label), input, val);
    return wrap;
  }

  function buildSeg(c, T) {
    const wrap = el('div', 'seg');
    wrap.setAttribute('role', 'group');
    c.options.forEach(([value, label]) => {
      const on = T.get(c.key) === value;
      const b = el('button', on ? 'on' : '', label);
      b.setAttribute('aria-pressed', on);
      b.addEventListener('click', () => { T.set(c.key, value, true); renderOptions(true); });
      wrap.append(b);
    });
    return wrap;
  }

  function buildStepper(c, T) {
    const wrap = el('div', 'ctl-slider');
    const box = el('div', 'stepper');
    const v = T.get(c.key);
    const minus = el('button', null, '−');
    const plus = el('button', null, '+');
    minus.setAttribute('aria-label', 'Уменьшить номер');
    plus.setAttribute('aria-label', 'Увеличить номер');
    minus.disabled = v <= 1;
    plus.disabled = v >= 99;
    minus.addEventListener('click', () => { T.set(c.key, Math.max(1, T.get(c.key) - 1), true); renderOptions(true); });
    plus.addEventListener('click', () => { T.set(c.key, Math.min(99, T.get(c.key) + 1), true); renderOptions(true); });
    box.append(minus, el('span', 'val', String(v)), plus);
    wrap.append(el('span', 'ctl-label', c.label), box);
    return wrap;
  }

  function buildColor(c, T) {
    const wrap = el('div', 'colors');
    const swatches = [];
    PALETTE.forEach((col) => {
      const b = el('button', 'swatch');
      b.style.setProperty('--c', col);
      b.dataset.color = col.toLowerCase();
      b.setAttribute('aria-label', 'Цвет ' + col);
      b.addEventListener('click', () => { T.set(c.key, col, true); mark(); });
      swatches.push(b);
      wrap.append(b);
    });
    const custom = el('label', 'swatch custom');
    custom.title = 'Свой цвет';
    const input = document.createElement('input');
    input.type = 'color';
    input.value = T.get(c.key);
    input.setAttribute('aria-label', 'Свой цвет');
    input.addEventListener('input', () => { T.set(c.key, input.value, false); mark(); });
    input.addEventListener('change', () => { T.set(c.key, input.value, true); mark(); });
    custom.append(input);
    wrap.append(custom);

    function mark() {
      const v = String(T.get(c.key)).toLowerCase();
      const inPalette = PALETTE.some((p) => p.toLowerCase() === v);
      swatches.forEach((b) => b.classList.toggle('on', b.dataset.color === v));
      custom.classList.toggle('on', !inPalette);
      custom.style.setProperty('--c', v);
    }
    mark();
    return wrap;
  }

  // Подпись текущего состояния панели: перестраиваем её, только когда оно изменилось,
  // чтобы не сбивать ползунок, который пользователь сейчас тянет
  let optionsSig = null;
  function currentOptionsSig() {
    if (!S.image) return 'empty';
    if (S.mode === 'crop') return `crop|${S.cropAspect}`;
    const T = optionsTarget();
    const vals = OPTIONS[T.type].map((c) => (c.key ? T.get(c.key) : '')).join('|');
    return `${S.mode}|${S.selectedId}|${vals}`;
  }

  function renderOptions(force = true) {
    const sig = currentOptionsSig();
    if (!force && sig === optionsSig) return;
    optionsSig = sig;

    const root = $('options');
    root.textContent = '';
    if (!S.image) {
      root.append(el('span', 'opt-empty', 'Откройте скриншот, чтобы начать'));
      return;
    }
    if (S.mode === 'crop') { renderCropOptions(root); return; }
    const T = optionsTarget();
    root.append(el('span', 'opt-title', T.title));
    OPTIONS[T.type].forEach((c) => {
      if (c.when && !c.when(T.get)) return;
      if (c.layerOnly && !T.layer) return;
      if (c.toolOnly && T.layer) return;
      root.append(el('div', 'vsep'));
      if (c.t === 'slider') root.append(buildSlider(c, T));
      else if (c.t === 'seg') root.append(buildSeg(c, T));
      else if (c.t === 'color') root.append(buildColor(c, T));
      else if (c.t === 'stepper') root.append(buildStepper(c, T));
      else if (c.t === 'next') {
        const n = el('span', 'next-num', 'Следующий номер ');
        n.append(el('b', null, String(nextMarkerNum())));
        root.append(n);
      }
      else if (c.t === 'note') {
        const n = el('span', 'note');
        n.innerHTML = ICONS.info;
        n.append(el('span', null, c.text));
        root.append(n);
      }
    });
    if (T.layer) {
      root.append(el('div', 'vsep'));
      const del = el('button', 'btn-icon opt-del');
      del.innerHTML = ICONS.trash;
      del.title = 'Удалить слой (Delete)';
      del.setAttribute('aria-label', 'Удалить слой');
      del.addEventListener('click', deleteSelected);
      root.append(del);
    }
  }

  // Пока вводится текст, клики по цвету и начертанию не должны закрывать поле
  $('options').addEventListener('mousedown', (e) => {
    if (S.draft && e.target.closest('button')) e.preventDefault();
  });

  // ─── Слои ─────────────────────────────────────────────────
  const layerName = (a) => (a.type === 'text'
    ? `«${a.text.split('\n')[0]}${a.text.includes('\n') ? '…' : ''}»`
    : a.type === 'marker' ? `Маркер ${a.num}`
    : a.type === 'blur' ? (a.variant === 'pixelate' ? 'Пикселизация' : 'Размытие') : TYPE_LABEL[a.type]);

  function renderLayers() {
    const list = $('layerList');
    list.textContent = '';
    $('layerCount').textContent = S.annotations.length || '';

    for (let i = S.annotations.length - 1; i >= 0; i--) {
      const a = S.annotations[i];
      const li = el('li', 'layer' + (a.id === S.selectedId ? ' on' : ''));
      const dot = el('span', 'dot' + (a.type === 'arrow' || a.type === 'text' || a.type === 'marker' ? ' round' : ''));
      dot.style.setProperty('--c', a.type === 'blur' ? '#8a8591' : a.type === 'focus' ? '#3a3540' : a.color);
      const del = el('button', 'del');
      del.innerHTML = ICONS.x;
      del.setAttribute('aria-label', 'Удалить слой ' + layerName(a));
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        if (S.selectedId === a.id) S.selectedId = null;
        commit((l) => l.filter((x) => x.id !== a.id));
      });
      li.addEventListener('click', () => select(a.id));
      li.append(dot, el('span', 'name', layerName(a)), del);
      list.append(li);
    }

    if (!S.annotations.length) {
      list.append(el('li', 'layers-empty', 'Нарисуйте стрелку, рамку или добавьте текст — всё появится здесь'));
    }
    const base = el('li', 'layer base');
    const dot = el('span', 'dot');
    dot.style.setProperty('--c', 'rgba(255,255,255,.3)');
    base.append(dot, el('span', 'name', 'Скриншот'));
    list.append(base);
  }

  function updateButtons() {
    $('undoBtn').disabled = !S.undo.length;
    $('redoBtn').disabled = !S.redo.length;
    $('downloadBtn').disabled = !S.image;
    $('resetBtn').disabled = !S.image;
  }

  // ─── Текстовое поле ───────────────────────────────────────
  function positionDraft(d) {
    const inp = d.el;
    const z = S.scale;
    const m = textMetrics({ text: inp.value || 'Текст', size: d.size, bold: d.bold });
    const plate = hasPlate(d);
    const { px: padX, py: padY, r } = platePad(d);
    const px_ = plate ? padX : 0, py_ = plate ? padY : 0;
    // Поле повторяет будущий слой: та же плашка, отступы и межстрочный интервал
    const lead = d.size * (LINE - 1) / 2; // textarea добавляет половину интерлиньяжа сверху
    inp.style.left = (d.x - px_) * z + 'px';
    inp.style.top = (d.y - py_ - lead) * z + 'px';
    inp.style.padding = `${py_ * z}px ${px_ * z}px`;
    inp.style.width = (m.w + px_ * 2) * z + 4 + 'px';
    inp.style.height = ((m.lines.length * m.lh) + py_ * 2) * z + 'px';
    inp.style.font = textFont(d.size * z, d.bold);
    inp.style.lineHeight = m.lh * z + 'px';
    inp.style.background = plate ? d.color : 'transparent';
    inp.style.color = plate ? readableOn(d.color) : d.color;
    inp.style.borderRadius = plate ? r * z + 'px' : '0';
    inp.style.outline = plate ? `1.5px solid ${SELECT_COLOR}` : '1px dashed currentColor';
  }

  // edit — существующий текстовый слой, который правим
  function openDraft(p, edit) {
    const src = edit || S.text;
    const d = {
      x: edit ? edit.x : p.x,
      y: edit ? edit.y : p.y,
      variant: src.variant || 'plain',
      color: src.color, size: src.size, bold: src.bold,
      editId: edit ? edit.id : null,
      original: edit ? edit.text : '',
    };
    const inp = el('textarea', 'text-draft');
    inp.placeholder = 'Текст';
    inp.spellcheck = false;
    inp.rows = 1;
    inp.wrap = 'off';
    inp.value = d.original;
    d.el = inp;
    inp.addEventListener('input', () => positionDraft(d));
    inp.addEventListener('keydown', (e) => {
      // Enter — готово, Shift+Enter — новая строка
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); commitText(true); }
      if (e.key === 'Escape') { e.preventDefault(); cancelText(); }
    });
    inp.addEventListener('blur', () => commitText(false));
    S.draft = d;
    if (edit) { S.hiddenId = edit.id; S.selectedId = edit.id; redraw(); renderLayers(); renderOptions(false); }
    canvasWrap.append(inp);
    positionDraft(d);
    setTimeout(() => { inp.focus(); if (edit) inp.select(); }, 0);
  }

  // Безопасно вызывать несколько раз. selectAfter — выделить слой после ввода
  function commitText(selectAfter) {
    const d = S.draft;
    if (!d) return;
    S.draft = null;
    S.hiddenId = null;
    // Убираем пустые строки по краям, но сохраняем переносы внутри
    const text = d.el.value.replace(/\s+$/, '').replace(/^\s*\n/, '');
    d.el.remove();

    if (d.editId != null) {
      if (!text.trim()) { S.selectedId = null; commit((l) => l.filter((a) => a.id !== d.editId)); return; }
      const patch = { text, variant: d.variant, color: d.color, size: d.size, bold: d.bold };
      commit((l) => l.map((a) => (a.id === d.editId ? { ...a, ...patch } : a)));
      redraw();
      return;
    }
    if (!text.trim()) return;
    const id = newId();
    if (selectAfter) S.selectedId = id;
    pushAnnotation({ type: 'text', id, x: d.x, y: d.y, text, variant: d.variant, color: d.color, size: d.size, bold: d.bold });
  }

  function cancelText() {
    const d = S.draft;
    if (!d) return;
    S.draft = null;
    S.hiddenId = null;
    d.el.remove();
    redraw();
  }

  // ─── Ввод указателем на холсте ────────────────────────────
  let drawing = false;
  let drag = null; // { kind: 'move' | 'handle', id, handle, from, orig }

  const getPoint = (e) => {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (canvas.width / rect.width),
      y: (e.clientY - rect.top) * (canvas.height / rect.height),
    };
  };
  const tolerance = () => 8 / (V.zoom || 1);

  function startDrag(e, kind, a, handle, p) {
    canvas.setPointerCapture(e.pointerId);
    drag = { kind, id: a.id, handle, from: p, orig: a };
    if (S.selectedId !== a.id) select(a.id);
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!S.image || e.button > 0) return;
    const p = getPoint(e);

    if (S.mode === 'crop') {
      const hit = cropHitAt(p);
      canvas.setPointerCapture(e.pointerId);
      cropDrag = { ...hit, from: toImagePx(p), orig: { ...S.cropDraft } };
      return;
    }
    const tol = tolerance();
    const sel = selected();

    // Текст: клик по готовому тексту открывает его на правку
    if (S.mode === 'text') {
      e.preventDefault(); // не отдаём фокус холсту
      if (S.draft) { commitText(false); return; }
      // По готовому тексту: потянул — переместить, просто кликнул — править
      const t = hitTest(p, tol, (a) => a.type === 'text');
      if (t) {
        startDrag(e, 'move', t, null, p);
        drag.editOnClick = true;
        drag.screen = { x: e.clientX, y: e.clientY };
        return;
      }
    }

    // Ручки и тело выделенного слоя работают в любом инструменте
    if (sel) {
      const h = hitHandle(sel, p, tol);
      if (h) { startDrag(e, 'handle', sel, h.id, p); return; }
      if (hitLayer(sel, p, tol)) { startDrag(e, 'move', sel, null, p); return; }
    }

    if (S.mode === 'select') {
      const hit = hitTest(p, tol);
      if (hit) startDrag(e, 'move', hit, null, p);
      else deselect();
      return;
    }

    if (S.mode === 'marker') {
      // Клик по существующему маркеру — перетащить его, иначе поставить новый
      const hit = hitTest(p, tol, (a) => a.type === 'marker');
      if (hit) { startDrag(e, 'move', hit, null, p); return; }
      const m = { type: 'marker', id: newId(), ...S.marker, x: p.x, y: p.y, num: nextMarkerNum() };
      // Установка и перетаскивание сразу после неё — один шаг истории
      endLiveEdit();
      S.liveBase = S.annotations;
      S.annotations = [...S.annotations, m];
      S.selectedId = m.id;
      canvas.setPointerCapture(e.pointerId);
      drag = { kind: 'move', id: m.id, handle: null, from: p, orig: m };
      redraw();
      renderLayers();
      renderOptions(false);
      updateStatus();
      return;
    }

    if (sel) deselect();

    if (S.mode === 'text') { openDraft(p); return; }

    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    S.current = { type: S.mode, ...S[S.mode], id: newId(), start: p, end: p };
    scheduleRedraw();
  });

  canvas.addEventListener('dblclick', (e) => {
    if (!S.image || S.draft || S.mode === 'crop') return;
    const t = hitTest(getPoint(e), tolerance(), (a) => a.type === 'text');
    if (t) openDraft(null, t);
  });

  function hoverCursor(p) {
    const tol = tolerance();
    const sel = selected();
    if (sel) {
      const h = hitHandle(sel, p, tol);
      if (h) return HANDLE_CURSOR[h.id];
      if (hitLayer(sel, p, tol)) return 'move';
    }
    if (S.mode === 'text' && hitTest(p, tol, (a) => a.type === 'text')) return 'move';
    if (S.mode === 'marker' && hitTest(p, tol, (a) => a.type === 'marker')) return 'move';
    if (S.mode === 'select') return hitTest(p, tol) ? 'move' : 'grab';
    return S.mode === 'text' ? 'text' : 'crosshair';
  }

  canvas.addEventListener('pointermove', (e) => {
    if (!S.image) return;
    const p = getPoint(e);

    if (S.mode === 'crop') {
      if (cropDrag) {
        const ip = toImagePx(p);
        const o = cropDrag.orig;
        const { w: W, h: H } = fullRegion();
        if (cropDrag.kind === 'move') {
          S.cropDraft = { ...o, x: clampN(o.x + ip.x - cropDrag.from.x, 0, W - o.w), y: clampN(o.y + ip.y - cropDrag.from.y, 0, H - o.h) };
        } else if (cropDrag.kind === 'handle') {
          S.cropDraft = resizeCrop(o, cropDrag.id, ip);
        } else {
          S.cropDraft = newCrop(cropDrag.from, ip);
        }
        updateCropSize();
        scheduleRedraw();
      } else if (e.pointerType === 'mouse') {
        const h = cropHitAt(p);
        canvas.style.cursor = h.kind === 'handle' ? CROP_CURSOR[h.id] : h.kind === 'move' ? 'move' : 'crosshair';
      }
      return;
    }

    if (drag) {
      if (drag.editOnClick) {
        // Пока указатель почти не сдвинулся, это ещё клик, а не перетаскивание
        if (Math.hypot(e.clientX - drag.screen.x, e.clientY - drag.screen.y) < 4) return;
        drag.editOnClick = false;
      }
      const dx = p.x - drag.from.x, dy = p.y - drag.from.y;
      const o = drag.orig;
      let patch;
      if (drag.kind === 'move') patch = translated(o, dx, dy);
      else if (drag.handle === 'tail') patch = { tail: { x: p.x, y: p.y } };
      else if (drag.handle === 'mid') patch = { style: 'curved', bend: bendFromPoint(o, p) };
      else if (o.type === 'arrow') patch = { [drag.handle]: { x: p.x, y: p.y } };
      else patch = resizedRect(o, drag.handle, p);
      liveEdit(drag.id, patch);
      return;
    }
    if (drawing && S.current) {
      S.current.end = p;
      scheduleRedraw();
      return;
    }
    if (e.pointerType === 'mouse') canvas.style.cursor = hoverCursor(p);
  });

  const endPointerOnCanvas = () => {
    if (cropDrag) { cropDrag = null; return; }
    if (drag) {
      const clickToEdit = drag.editOnClick ? drag.orig : null;
      drag = null;
      endLiveEdit();
      if (clickToEdit) openDraft(null, selected() || clickToEdit);
      return;
    }
    if (!drawing) return;
    drawing = false;
    const cur = S.current;
    S.current = null;
    if (cur) {
      const { width, height } = toRect(cur.start, cur.end);
      const bigEnough = cur.type === 'arrow' ? Math.hypot(width, height) > 5 : width > 3 && height > 3;
      if (bigEnough) {
        S.selectedId = cur.id; // только что нарисованное сразу можно поправить
        pushAnnotation(cur);
        return;
      }
    }
    redraw();
  };
  canvas.addEventListener('pointerup', endPointerOnCanvas);
  canvas.addEventListener('pointercancel', endPointerOnCanvas);

  function switchMode(m) {
    commitText(false);
    const wasCrop = S.mode === 'crop';
    if (wasCrop && m !== 'crop') applyCropDraft(); // уход из кадрирования применяет рамку
    S.mode = m;
    S.selectedId = null;
    if (m === 'crop' && !wasCrop) { S.cropDraft = { ...(S.crop || fullRegion()) }; S.cropAspect = null; }
    canvas.style.cursor = m === 'select' ? 'grab' : m === 'text' ? 'text' : 'crosshair';
    if (wasCrop !== (m === 'crop')) V.fitted = true; // размер холста меняется — вписываем заново
    redraw();
    fit();
    updateButtons();
    renderRail();
    renderLayers();
    renderOptions(true);
    updateStatus();
  }

  // ─── Кадрирование ─────────────────────────────────────────
  const CROP_MIN = 16;
  const ASPECTS = [[null, 'Свободно'], [1, '1:1'], [4 / 3, '4:3'], [16 / 9, '16:9']];
  let cropDrag = null;
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const toImagePx = (p) => ({ x: p.x - S.fx.padding, y: p.y - S.fx.padding });

  function cropHandles(d) {
    const pad = S.fx.padding;
    const l = pad + d.x, t = pad + d.y, r = l + d.w, b = t + d.h, cx = l + d.w / 2, cy = t + d.h / 2;
    const all = [
      { id: 'nw', x: l, y: t }, { id: 'n', x: cx, y: t }, { id: 'ne', x: r, y: t }, { id: 'e', x: r, y: cy },
      { id: 'se', x: r, y: b }, { id: 's', x: cx, y: b }, { id: 'sw', x: l, y: b }, { id: 'w', x: l, y: cy },
    ];
    // С фиксированными пропорциями тянуть можно только за углы
    return S.cropAspect ? all.filter((h) => h.id.length === 2) : all;
  }

  const CROP_CURSOR = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize', n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize' };

  function cropHitAt(p) {
    const d = S.cropDraft;
    const tol = tolerance() * 1.6;
    const h = cropHandles(d).find((q) => Math.hypot(p.x - q.x, p.y - q.y) <= tol);
    if (h) return { kind: 'handle', id: h.id };
    const ip = toImagePx(p);
    if (ip.x >= d.x && ip.x <= d.x + d.w && ip.y >= d.y && ip.y <= d.y + d.h) return { kind: 'move' };
    return { kind: 'new' };
  }

  // Подгоняем пропорции, не выходя за уже заданную ширину и высоту
  function fitToAspect(w, h, aspect) {
    if (!aspect) return [w, h];
    return w / h > aspect ? [h * aspect, h] : [w, w / aspect];
  }

  function resizeCrop(o, id, ip) {
    const { w: W, h: H } = fullRegion();
    const px_ = clampN(ip.x, 0, W), py_ = clampN(ip.y, 0, H);
    let l = o.x, t = o.y, r = o.x + o.w, b = o.y + o.h;
    if (id.includes('w')) l = Math.min(px_, r - CROP_MIN);
    if (id.includes('e')) r = Math.max(px_, l + CROP_MIN);
    if (id.includes('n')) t = Math.min(py_, b - CROP_MIN);
    if (id.includes('s')) b = Math.max(py_, t + CROP_MIN);
    if (S.cropAspect) {
      const [w, h] = fitToAspect(r - l, b - t, S.cropAspect);
      if (id.includes('w')) l = r - w; else r = l + w;
      if (id.includes('n')) t = b - h; else b = t + h;
    }
    return { x: l, y: t, w: r - l, h: b - t };
  }

  function newCrop(start, ip) {
    const { w: W, h: H } = fullRegion();
    const ex = clampN(ip.x, 0, W), ey = clampN(ip.y, 0, H);
    let [w, h] = fitToAspect(Math.max(CROP_MIN, Math.abs(ex - start.x)), Math.max(CROP_MIN, Math.abs(ey - start.y)), S.cropAspect);
    const x = ex < start.x ? start.x - w : start.x;
    const y = ey < start.y ? start.y - h : start.y;
    return { x: clampN(x, 0, W - w), y: clampN(y, 0, H - h), w: Math.min(w, W), h: Math.min(h, H) };
  }

  function setAspect(aspect) {
    S.cropAspect = aspect;
    if (aspect) {
      const d = S.cropDraft;
      const [w, h] = fitToAspect(d.w, d.h, aspect);
      S.cropDraft = { x: d.x + (d.w - w) / 2, y: d.y + (d.h - h) / 2, w, h };
    }
    redraw();
    renderOptions(true);
  }

  function drawCropOverlay(c) {
    const d = S.cropDraft;
    if (!d) return;
    const pad = S.fx.padding;
    const { w: iw, h: ih } = fullRegion();
    const z = V.zoom || 1;
    const x = pad + d.x, y = pad + d.y;
    c.save();
    // Затемняем всё за пределами рамки
    c.beginPath();
    c.rect(pad, pad, iw, ih);
    c.rect(x, y, d.w, d.h);
    c.fillStyle = 'rgba(8, 6, 12, 0.6)';
    c.fill('evenodd');
    // Сетка третей
    c.strokeStyle = 'rgba(255, 255, 255, 0.45)';
    c.lineWidth = 1 / z;
    c.beginPath();
    for (let i = 1; i < 3; i++) {
      c.moveTo(x + (d.w * i) / 3, y); c.lineTo(x + (d.w * i) / 3, y + d.h);
      c.moveTo(x, y + (d.h * i) / 3); c.lineTo(x + d.w, y + (d.h * i) / 3);
    }
    c.stroke();
    c.strokeStyle = '#fff';
    c.lineWidth = 1.5 / z;
    c.strokeRect(x, y, d.w, d.h);
    // Ручки
    const hs = 5 / z;
    cropHandles(d).forEach((h) => {
      c.fillStyle = '#fff';
      c.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      c.lineWidth = 1 / z;
      c.fillRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
      c.strokeRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
    });
    c.restore();
  }

  const updateCropSize = () => {
    const e = document.getElementById('cropSize');
    if (e && S.cropDraft) e.textContent = `${Math.round(S.cropDraft.w)} × ${Math.round(S.cropDraft.h)}`;
  };

  // Применяет рамку: слои сдвигаются, чтобы остаться на тех же местах изображения
  function applyCropDraft() {
    const d = S.cropDraft;
    S.cropDraft = null;
    if (!d || !S.image) return;
    const full = fullRegion();
    const r = { x: Math.round(d.x), y: Math.round(d.y), w: Math.round(d.w), h: Math.round(d.h) };
    const next = r.x === 0 && r.y === 0 && r.w === full.w && r.h === full.h ? null : r;
    const cur = S.crop;
    const same = (cur === null && next === null) ||
      (cur && next && cur.x === next.x && cur.y === next.y && cur.w === next.w && cur.h === next.h);
    if (same) return;
    endLiveEdit();
    pushHistory(S.annotations);
    const dx = (cur ? cur.x : 0) - (next ? next.x : 0);
    const dy = (cur ? cur.y : 0) - (next ? next.y : 0);
    if (dx || dy) S.annotations = S.annotations.map((a) => ({ ...a, ...translated(a, dx, dy) }));
    S.crop = next;
  }

  function cancelCrop() {
    if (S.mode !== 'crop') return;
    S.cropDraft = null; // без рамки нечего применять
    switchMode('select');
  }

  function renderCropOptions(root) {
    root.append(el('span', 'opt-title', 'Кадрирование'));
    root.append(el('div', 'vsep'));
    const seg = el('div', 'seg');
    ASPECTS.forEach(([value, label]) => {
      const on = S.cropAspect === value;
      const b = el('button', on ? 'on' : '', label);
      b.setAttribute('aria-pressed', on);
      b.addEventListener('click', () => setAspect(value));
      seg.append(b);
    });
    root.append(seg);
    root.append(el('span', 'crop-size'));
    root.lastChild.id = 'cropSize';
    root.append(el('span', 'opt-spacer'));
    const resetB = el('button', 'btn-pill sm', 'Всё изображение');
    resetB.addEventListener('click', () => { S.cropAspect = null; S.cropDraft = fullRegion(); redraw(); renderOptions(true); });
    const cancelB = el('button', 'btn-pill sm', 'Отмена');
    cancelB.addEventListener('click', cancelCrop);
    const applyB = el('button', 'btn-pill btn-primary sm', 'Применить');
    applyB.addEventListener('click', () => switchMode('select'));
    root.append(resetB, cancelB, applyB);
    updateCropSize();
  }

  // ─── Загрузка изображения ─────────────────────────────────
  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) {
      if (file) toast('Это не изображение — выберите PNG, JPG или WebP');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        cancelText();
        S.image = img;
        S.imageId++;
        S.annotations = [];
        S.undo = [];
        S.redo = [];
        S.liveBase = null;
        S.selectedId = null;
        S.current = null;
        S.crop = null;
        S.cropDraft = null;
        if (S.mode === 'crop') S.mode = 'select';
        // Толщина по умолчанию зависит от размера картинки, чтобы на больших скриншотах линии не терялись
        const base = Math.max(3, Math.round(Math.max(img.naturalWidth, img.naturalHeight) / 400));
        S.arrow.thickness = Math.min(40, base);
        S.box.thickness = Math.min(40, base);
        S.marker.size = Math.min(80, Math.max(16, Math.round(Math.max(img.naturalWidth, img.naturalHeight) / 60)));
        const amb = $('ambientImg');
        amb.style.backgroundImage = `url("${ev.target.result}")`;
        amb.classList.add('on');
        $('empty').hidden = true;
        canvasWrap.hidden = false;
        $('status').hidden = false;
        $('layers').hidden = false;
        canvas.width = 0; // гарантирует пересчёт размера в redraw
        V.fitted = true;
        switchMode(S.mode);
        changed();
      };
      img.onerror = () => toast('Не удалось открыть файл — попробуйте другой формат');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change', () => { loadFile(fileInput.files[0]); fileInput.value = ''; });
  $('openBtn').addEventListener('click', () => fileInput.click());
  $('emptyOpenBtn').addEventListener('click', () => fileInput.click());

  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) { e.preventDefault(); loadFile(item.getAsFile()); }
  });

  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (hasFiles(e)) { e.preventDefault(); dragDepth++; app.classList.add('dragging'); } });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) app.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    app.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });

  // ─── Скачивание ───────────────────────────────────────────
  let downloadsApi = null;
  try {
    if (window.claude && window.claude.use) {
      window.claude.use('downloads').then((d) => { downloadsApi = d; }).catch(() => {});
    }
  } catch (_) {}

  async function download() {
    if (!S.image) return;
    commitText(false);
    if (S.mode === 'crop') switchMode('select');
    // Рендерим отдельно, чтобы рамка выделения не попала в файл
    const { w, h } = exportSize();
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    paint(out.getContext('2d'), false);
    const blob = await new Promise((r) => out.toBlob(r, 'image/png'));
    if (!blob) { toast('Не удалось подготовить файл'); return; }
    const filename = `screenshot-${Date.now()}.png`;

    if (downloadsApi) {
      try {
        await downloadsApi.save({ filename, data: blob });
        toast('Сохранено');
      } catch (err) {
        const code = err && err.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') toast('Окно сохранения уже открыто');
        else if (code === 'too_large') toast('Файл слишком большой — уменьшите отступы');
        else toast('Не удалось сохранить файл');
      }
      return;
    }
    const a = document.createElement('a');
    a.download = filename;
    a.href = URL.createObjectURL(blob);
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // ─── Сброс ────────────────────────────────────────────────
  function reset() {
    cancelText();
    S.image = null;
    S.fx = { ...FX_DEFAULTS };
    S.annotations = [];
    S.undo = [];
    S.redo = [];
    S.liveBase = null;
    S.selectedId = null;
    S.current = null;
    S.crop = null;
    S.cropDraft = null;
    S.mode = 'select';
    rounded = { key: null, canvas: null };
    V.fitted = true;
    $('ambientImg').classList.remove('on');
    $('empty').hidden = false;
    canvasWrap.hidden = true;
    $('status').hidden = true;
    $('layers').hidden = true;
    renderRail();
    renderOptions(true);
    renderLayers();
    updateButtons();
  }

  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);
  $('resetBtn').addEventListener('click', reset);
  $('downloadBtn').addEventListener('click', download);

  // ─── Перемещение и масштаб холста ─────────────────────────
  let spaceHeld = false;
  let pan = null;
  let pinch = null;
  const touches = new Map();

  const releaseSpace = () => { spaceHeld = false; stage.classList.remove('pan-ready'); };
  window.addEventListener('blur', releaseSpace);

  const cancelDrawing = () => {
    if (drag) { drag = null; endLiveEdit(); }
    if (!drawing) return;
    drawing = false;
    S.current = null;
    scheduleRedraw();
  };

  const pinchState = () => {
    const [a, b] = [...touches.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  };

  // Попадёт ли клик в режиме «Выбор» по слою или ручке (тогда это не перемещение холста)
  function hitsLayerAt(e) {
    if (e.target !== canvas) return false;
    const p = getPoint(e);
    const tol = tolerance();
    const sel = selected();
    return !!((sel && (hitHandle(sel, p, tol) || hitLayer(sel, p, tol))) || hitTest(p, tol));
  }

  // Фаза захвата: перехватываем жест раньше рисования на холсте
  stage.addEventListener('pointerdown', (e) => {
    if (!S.image || e.target.closest('button, .status, .text-draft')) return;

    if (e.pointerType === 'touch') {
      touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (touches.size === 2) {
        cancelDrawing();
        const p = pinchState();
        pinch = { ...p, zoom: V.zoom, x: V.x, y: V.y };
        e.stopPropagation();
        return;
      }
    }

    const wantPan = spaceHeld || e.button === 1 || (S.mode === 'select' && e.button === 0 && !hitsLayerAt(e));
    if (!wantPan) return;
    e.preventDefault();
    e.stopPropagation();
    commitText(false);
    if (!spaceHeld && e.button === 0 && S.selectedId != null) deselect(); // клик мимо слоёв снимает выделение
    pan = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x: V.x, y: V.y };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('panning');
  }, true);

  stage.addEventListener('pointermove', (e) => {
    if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinch && touches.size >= 2) {
      const p = pinchState();
      const r = stage.getBoundingClientRect();
      const nz = clampZoom(pinch.zoom * (p.d / pinch.d));
      const k = nz / pinch.zoom;
      V.x = (p.cx - r.left) - (pinch.cx - r.left - pinch.x) * k;
      V.y = (p.cy - r.top) - (pinch.cy - r.top - pinch.y) * k;
      V.zoom = nz;
      V.fitted = false;
      applyView();
      e.stopPropagation();
      return;
    }

    if (pan && e.pointerId === pan.id) {
      V.x = pan.x + (e.clientX - pan.sx);
      V.y = pan.y + (e.clientY - pan.sy);
      V.fitted = false;
      applyView();
      e.stopPropagation();
    }
  }, true);

  const endStagePointer = (e) => {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = null;
    if (pan && e.pointerId === pan.id) { pan = null; stage.classList.remove('panning'); }
  };
  stage.addEventListener('pointerup', endStagePointer, true);
  stage.addEventListener('pointercancel', endStagePointer, true);

  stage.addEventListener('wheel', (e) => {
    if (!S.image) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : 1;
    if (e.ctrlKey || e.metaKey) {
      const r = stage.getBoundingClientRect();
      const dy = Math.max(-60, Math.min(60, e.deltaY * unit));
      zoomTo(V.zoom * Math.exp(-dy * 0.006), e.clientX - r.left, e.clientY - r.top);
    } else {
      V.x -= e.deltaX * unit;
      V.y -= e.deltaY * unit;
      V.fitted = false;
      applyView();
    }
  }, { passive: false });

  $('zoomIn').addEventListener('click', () => zoomStep(1));
  $('zoomOut').addEventListener('click', () => zoomStep(-1));
  $('zoom').addEventListener('click', fitView);

  // ─── Горячие клавиши ──────────────────────────────────────
  // e.code не зависит от раскладки: в русской e.key для Z будет «я»
  const NUDGE = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };

  window.addEventListener('keydown', (e) => {
    const t = e.target;
    const typing = t.tagName === 'TEXTAREA' || t.isContentEditable || (t.tagName === 'INPUT' && t.type === 'text');
    if (typing) return;
    const onRange = t.tagName === 'INPUT' && t.type === 'range';
    const mod = e.metaKey || e.ctrlKey;

    if (e.code === 'Space') {
      if (!S.image) return;
      e.preventDefault(); // не прокручивать страницу и не нажимать кнопку в фокусе
      if (!spaceHeld) { spaceHeld = true; stage.classList.add('pan-ready'); }
      return;
    }

    if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
    if (mod && e.code === 'KeyS') { e.preventDefault(); download(); return; }
    if (mod && e.code === 'KeyO') { e.preventDefault(); fileInput.click(); return; }
    if (mod && e.code === 'KeyD' && S.selectedId != null) { e.preventDefault(); duplicateSelected(); return; }
    if (mod && S.image && (e.code === 'Equal' || e.code === 'NumpadAdd')) { e.preventDefault(); zoomStep(1); return; }
    if (mod && S.image && (e.code === 'Minus' || e.code === 'NumpadSubtract')) { e.preventDefault(); zoomStep(-1); return; }
    if (mod && S.image && (e.code === 'Digit0' || e.code === 'Numpad0')) { e.preventDefault(); fitView(); return; }
    if (mod && S.image && (e.code === 'Digit1' || e.code === 'Numpad1')) { e.preventDefault(); zoomTo(1); return; }
    if (mod || e.altKey) return;

    if (S.mode === 'crop') {
      if (e.key === 'Enter') { e.preventDefault(); switchMode('select'); return; }
      if (e.key === 'Escape') { e.preventDefault(); cancelCrop(); return; }
    }

    const sel = selected();
    if (sel && (e.key === 'Backspace' || e.key === 'Delete')) { e.preventDefault(); deleteSelected(); return; }
    if (sel && e.key === 'Escape') { e.preventDefault(); deselect(); return; }
    if (sel && e.key === 'Enter' && sel.type === 'text') { e.preventDefault(); openDraft(null, sel); return; }
    if (sel && NUDGE[e.key] && !onRange) {
      e.preventDefault();
      const [dx, dy] = NUDGE[e.key];
      const step = e.shiftKey ? 10 : 1;
      liveEdit(sel.id, translated(sel, dx * step, dy * step));
      return;
    }

    const tool = TOOLS.find((x) => x.code === e.code);
    if (tool && S.image && !onRange) { e.preventDefault(); switchMode(tool.id); }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' && spaceHeld) { e.preventDefault(); releaseSpace(); }
    if (NUDGE[e.key]) endLiveEdit(); // серия сдвигов стрелками — один шаг истории
  });

  // ─── Уведомления ──────────────────────────────────────────
  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ─── Старт ────────────────────────────────────────────────
  canvas.style.cursor = 'grab';
  renderRail();
  renderOptions(true);
  renderLayers();
  updateButtons();
})();
</script>
</body>
</html>

</body></html>
