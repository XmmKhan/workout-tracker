<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f2f7; --surface: #ffffff; --surface-2: #e9e9ee; --sheet: #ffffff; --inset: #f2f2f7;
  --line: rgba(0,0,0,.08); --text: #1d1d1f; --muted: #6e6e73; --faint: #b0b0b5; --chart: #1d1d1f;
  --pos: #1e8e3e; --pos-bg: rgba(52,199,89,.15); --neg: #c4320a; --neg-bg: rgba(255,69,58,.12);
  --danger: #d70015; --cta-bg: #1d1d1f; --cta-fg: #ffffff; --done-bg: rgba(52,199,89,.12); --check-on: #34c759;
  --backdrop: rgba(0,0,0,.35); --shadow: 0 12px 32px rgba(0,0,0,.14);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --sheet: #232325; --inset: #1c1c1e;
    --line: rgba(255,255,255,.08); --text: #f5f5f7; --muted: #8e8e93; --faint: #545458; --chart: #f5f5f7;
    --pos: #32d74b; --pos-bg: rgba(50,215,75,.16); --neg: #ff6961; --neg-bg: rgba(255,69,58,.16);
    --danger: #ff453a; --cta-bg: #d1d1d6; --cta-fg: #000000; --done-bg: rgba(50,215,75,.10); --check-on: #30d158;
    --backdrop: rgba(0,0,0,.6); --shadow: 0 12px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --sheet: #232325; --inset: #1c1c1e;
  --line: rgba(255,255,255,.08); --text: #f5f5f7; --muted: #8e8e93; --faint: #545458; --chart: #f5f5f7;
  --pos: #32d74b; --pos-bg: rgba(50,215,75,.16); --neg: #ff6961; --neg-bg: rgba(255,69,58,.16);
  --danger: #ff453a; --cta-bg: #d1d1d6; --cta-fg: #000000; --done-bg: rgba(50,215,75,.10); --check-on: #30d158;
  --backdrop: rgba(0,0,0,.6); --shadow: 0 12px 40px rgba(0,0,0,.6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { max-width: 460px; margin: 0 auto; padding: 10px 16px 140px; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.topbar h1 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.icon-btn.ghost { background: transparent; }
.back { display: inline-flex; align-items: center; gap: 2px; font-weight: 500; height: 44px; padding-right: 10px; margin-left: -6px; }
.muted { color: var(--muted); font-size: 15px; }
.label { font-size: 14px; font-weight: 600; color: var(--muted); }
.sec-title { font-size: 21px; font-weight: 700; letter-spacing: -.015em; margin: 10px 4px -4px; }

/* Week */
.week { background: var(--surface); border-radius: 24px; padding: 8px 8px 10px; }
.week-nav { display: flex; align-items: center; justify-content: space-between; }
.week-range { font-weight: 600; font-size: 15px; padding: 8px 12px; border-radius: 999px; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 2px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 6px; border-radius: 16px; }
.day .wd { font-size: 12px; color: var(--muted); font-weight: 500; }
.day .dn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; transition: background .15s, color .15s; }
.day.today .dn { box-shadow: inset 0 0 0 1.5px var(--text); }
.day.sel .dn { background: var(--text); color: var(--bg); }
.day .dot { width: 5px; height: 5px; border-radius: 50%; }
.day.has .dot { background: var(--text); }

/* Hero */
.hero { background: var(--surface); border-radius: 28px; padding: 20px; }
.hero-day { color: var(--muted); font-size: 15px; font-weight: 500; }
.hero-title { display: block; margin: 6px 0 2px; font-size: 46px; line-height: 1.02; font-weight: 700; letter-spacing: -.04em; text-align: left; overflow-wrap: anywhere; }
.hero-title.is-empty { color: var(--faint); }
.hero-sub { color: var(--muted); font-size: 15px; margin-top: 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.live { color: var(--text); }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; margin-top: 18px; border-radius: 999px; background: var(--cta-bg); color: var(--cta-fg); font-weight: 600; font-size: 17px; transition: transform .15s ease, opacity .15s; }
.cta:active { transform: scale(.98); }
.cta:disabled { opacity: .35; }
.cta .play { width: 24px; height: 24px; border-radius: 7px; background: var(--cta-fg); color: var(--cta-bg); display: grid; place-items: center; }
.cta.sm { width: auto; margin: 0; height: 52px; padding: 0 20px; font-size: 16px; flex: none; }
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 999px; background: var(--surface); font-weight: 600; transition: transform .15s ease; }
.btn-secondary:active { transform: scale(.98); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; padding: 10px 4px; }
.link-btn.quiet { color: var(--muted); font-weight: 500; }
.hero .list { margin-top: 14px; background: var(--surface-2); }
.hero-more { margin-top: 6px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 22px; padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.tile > svg { color: var(--muted); }
.tile-n { font-size: 27px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-n small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.tile-l { font-size: 12.5px; color: var(--muted); line-height: 1.2; }

/* Summary sheet-card */
.summary { background: var(--sheet); border: 1px solid var(--line); border-radius: 30px; padding: 22px 18px 18px; }
.big { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.big-n { font-size: 68px; font-weight: 800; letter-spacing: -.05em; line-height: .95; font-variant-numeric: tabular-nums; }
.big-u { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.delta { align-self: center; margin-left: 8px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; background: var(--pos-bg); color: var(--pos); font-variant-numeric: tabular-nums; }
.delta.neg { background: var(--neg-bg); color: var(--neg); }
.delta.flat { background: var(--surface-2); color: var(--muted); }
.big-label { margin-top: 8px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.summary .muted { margin-top: 10px; }
.chart-card { margin-top: 18px; background: var(--inset); border-radius: 22px; padding: 14px 6px 4px; }
.chart-head { display: flex; align-items: center; gap: 8px; padding: 0 10px; font-weight: 600; font-size: 15px; }
.chart-head > svg { color: var(--muted); }
.chart-head span { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; }
.chart { display: block; width: 100%; height: auto; margin-top: 4px; overflow: visible; }
.chart-line { fill: none; stroke: var(--chart); stroke-width: 2.25; stroke-linecap: round; }
.chart-dot { fill: var(--chart); stroke: var(--inset); stroke-width: 1.5; }
.chart-guide { stroke: var(--faint); stroke-dasharray: 2 4; stroke-width: 1; opacity: .7; }
.chart-val { fill: var(--text); font-size: 11.5px; font-weight: 700; font-family: inherit; }
.chart-lbl { fill: var(--muted); font-size: 10.5px; font-family: inherit; }
.chart-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }
.seg { display: flex; gap: 2px; background: var(--inset); border-radius: 999px; padding: 3px; margin-top: 18px; }
.seg button { flex: 1; height: 34px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }
.seg + .chart-card { margin-top: 10px; }

/* Lists */
.list { background: var(--surface); border-radius: 22px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 16px; min-height: 60px; }
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-end { color: var(--muted); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; font-size: 15px; flex: none; }
.row.danger .row-title { color: var(--danger); }

/* Workout */
.w-head { padding: 0 4px; }
.w-title { margin-top: 4px; font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1.05; overflow-wrap: anywhere; text-align: left; }
.ex-card { background: var(--surface); border-radius: 24px; padding: 12px 10px 4px; }
.ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 8px 6px; }
.ex-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; text-align: left; }
.ex-name svg { color: var(--muted); flex: none; }
.sets { display: flex; flex-direction: column; gap: 4px; }
.set { display: grid; grid-template-columns: 22px minmax(0,1fr) 72px 62px 42px; gap: 8px; align-items: center; padding: 4px; border-radius: 14px; font-variant-numeric: tabular-nums; transition: background .2s; }
.set.head { font-size: 12px; color: var(--muted); font-weight: 500; padding-top: 0; padding-bottom: 0; }
.set.head span:nth-child(n+3) { text-align: center; }
.set-n { color: var(--muted); font-weight: 600; text-align: center; font-size: 15px; }
.set-prev { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-in { width: 100%; height: 42px; border: 0; border-radius: 12px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; outline: none; -webkit-appearance: none; appearance: none; }
.set-in::placeholder { color: var(--faint); font-weight: 500; }
.set-in:focus { box-shadow: 0 0 0 2px var(--text); }
.set-check { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-2); color: var(--faint); display: grid; place-items: center; transition: background .15s, color .15s, transform .15s; }
.set-check:active { transform: scale(.9); }
.set-check[aria-pressed="true"] { background: var(--check-on); color: #fff; }
.set.is-done { background: var(--done-bg); }
.set.is-done .set-in { background: transparent; }
.ex-foot { display: flex; justify-content: space-between; padding: 0 4px; }
.empty-card { background: var(--surface); border-radius: 24px; padding: 22px 20px; }
.empty-title { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-bottom: 6px; }
.done-note { text-align: center; color: var(--muted); font-size: 15px; padding: 6px 0; }

/* History */
.hist { display: flex; flex-direction: column; gap: 10px; }
.hist-item { background: var(--surface); border-radius: 20px; padding: 14px 16px; }
.hist-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hist-date { font-weight: 600; }
.hist-w { font-size: 14px; color: var(--muted); text-align: left; }
.badge { font-size: 12px; font-weight: 700; color: var(--pos); background: var(--pos-bg); padding: 3px 9px; border-radius: 999px; flex: none; }
.set-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.set-chip { font-size: 14px; font-weight: 600; background: var(--surface-2); padding: 5px 10px; border-radius: 10px; font-variant-numeric: tabular-nums; }

/* Onboarding */
.onboard { background: var(--sheet); border: 1px solid var(--line); border-radius: 30px; padding: 22px 20px; }
.onboard h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.onboard .btn-secondary { margin-top: 16px; background: var(--surface-2); }
.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 6px; }

/* Dock: rest timer + toast */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px calc(14px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dock > * { pointer-events: auto; width: min(436px, 100%); }
.rest { position: relative; overflow: hidden; display: flex; align-items: center; gap: 2px; height: 60px; padding: 0 6px 0 20px; border-radius: 999px; background: var(--cta-bg); color: var(--cta-fg); box-shadow: var(--shadow); animation: up .3s cubic-bezier(.2,.8,.2,1); }
.rest > * { position: relative; }
.rest-bar { position: absolute; inset: 0 auto 0 0; background: currentColor; opacity: .1; transition: width .25s linear; }
.rest-label { font-weight: 500; font-size: 15px; opacity: .65; white-space: nowrap; }
.rest-time { font-weight: 700; font-size: 23px; font-variant-numeric: tabular-nums; margin: 0 auto 0 8px; }
.rest button { height: 46px; min-width: 46px; padding: 0 8px; border-radius: 999px; font-weight: 600; font-size: 15px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.rest button:active { background: rgba(127,127,127,.25); }
.toast { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 6px 6px 18px; border-radius: 18px; background: var(--sheet); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 15px; animation: up .25s cubic-bezier(.2,.8,.2,1); }
.toast span { flex: 1; }
.toast button { font-weight: 700; padding: 10px 14px; border-radius: 12px; }

/* Sheets */
.backdrop { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet); border-radius: 28px 28px 0 0; padding: 8px 18px calc(24px + env(safe-area-inset-bottom, 0px)); animation: up .3s cubic-bezier(.2,.8,.2,1); }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--faint); margin: 2px auto 12px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.sheet-head .icon-btn { background: var(--surface-2); width: 34px; height: 34px; }
.sheet-sub { margin: -8px 0 16px; color: var(--muted); font-size: 15px; }
.sheet .label { margin: 22px 2px 8px; }
.sheet .list { background: var(--surface-2); }
.field-row { display: flex; gap: 8px; }
.field { flex: 1; min-width: 0; height: 52px; border: 0; border-radius: 16px; background: var(--surface-2); padding: 0 16px; font: inherit; font-size: 17px; color: var(--text); outline: none; }
.field::placeholder { color: var(--muted); }
.field:focus { box-shadow: 0 0 0 2px var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); font-weight: 500; font-size: 15px; }

/* Gamification */
.tile.btn { cursor: pointer; transition: transform .15s ease; }
.tile.btn:active { transform: scale(.97); }
.ring-wrap { position: relative; width: 58px; height: 58px; display: grid; place-items: center; flex: none; }
.ring-wrap svg { position: absolute; inset: 0; }
.ring-track { stroke: var(--surface-2); }
.ring-fill { stroke: var(--text); transition: stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1), stroke .3s; }
.ring-fill.full { stroke: var(--check-on); }
.ring-n { position: relative; font-size: 21px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-n small { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.ach-strip { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border-radius: 22px; padding: 14px 14px 14px 16px; }
.ach-strip .row-title .muted { font-weight: 500; margin-left: 4px; }
.ach-mini { display: flex; flex: none; }
.ach-mini .badge-ic + .badge-ic { margin-left: -9px; }
.ach-strip > svg { color: var(--muted); flex: none; }
.badge-ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--faint); flex: none; }
.badge-ic.on { background: var(--text); color: var(--bg); }
.badge-ic.sm { width: 32px; height: 32px; box-shadow: 0 0 0 2.5px var(--surface); }
.badge-ic.pr { background: var(--pos-bg); color: var(--pos); }
.sheet .badge-ic { background: var(--sheet); }
.sheet .badge-ic.on { background: var(--text); }
.sheet .badge-ic.pr { background: var(--pos-bg); }
.ach-row { align-items: flex-start; }
.row-sub.wrap { white-space: normal; }
.bar { height: 4px; border-radius: 2px; background: rgba(127,127,127,.25); margin: 8px 0 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--text); border-radius: 2px; }
.goal-box { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 20px; padding: 14px 16px; }
.goal-box .ring-track { stroke: var(--sheet); }
.goal-chips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.goal-chips button { height: 54px; border-radius: 16px; background: var(--surface-2); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal-chips button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.row-end.strong { color: var(--text); font-weight: 700; }
.set-n { display: grid; place-items: center; }
.set-n svg { color: var(--pos); }
.set.pop { animation: flash 1.3s ease; }
.set.pop .set-check { animation: pop .5s cubic-bezier(.2,1.7,.4,1); }
.toast > svg { flex: none; color: var(--pos); }
.sheet .big-n { font-size: 60px; }
.sheet .cta { margin-top: 22px; }
@keyframes pop { from { transform: scale(.55); } to { transform: scale(1); } }
@keyframes flash { 0%, 45% { background: var(--pos-bg); } 100% { background: var(--done-bg); } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet { animation-name: sheetUp; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 360px) {
  .set { grid-template-columns: 18px minmax(0,1fr) 62px 54px 40px; gap: 6px; }
  .big-n { font-size: 56px; }
  .hero-title { font-size: 40px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
'use strict';
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

/* ---------- utils ---------- */
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

/* ---------- storage: localStorage now, private per-user cloud doc when available ---------- */
const LS_KEY = 'workout-tracker:v2';
const emptyState = () => ({ v: 2, workouts: {}, templates: {}, settings: { rest: 90, goal: 3 }, updatedAt: 0 });
const loadLocal = () => { try { const raw = localStorage.getItem(LS_KEY); if (raw) return { ...emptyState(), ...JSON.parse(raw) }; } catch (e) {} return emptyState(); };

function useStore() {
  const [state, setState] = useState(loadLocal);
  const [cloud, setCloud] = useState(false);
  const docRef = useRef(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        if (!window.claude || typeof window.claude.use !== 'function') return;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) return;
        const id = await user.id(); if (!id || !alive) return;
        const ref = db.collection('data/users/' + id).doc('tracker');
        const snap = await ref.get(); if (!alive) return;
        if (snap.exists) {
          const remote = snap.data();
          setState(cur => (remote.updatedAt || 0) > (cur.updatedAt || 0) ? { ...emptyState(), ...remote } : cur);
        }
        docRef.current = ref; setCloud(true);
      } catch (e) { console.warn('Облачное сохранение недоступно', e); }
    })();
    return () => { alive = false; };
  }, []);
  useEffect(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    if (!docRef.current || !state.updatedAt) return;
    const t = setTimeout(() => { docRef.current.set(JSON.parse(JSON.stringify(state))).catch(e => console.warn('Не удалось сохранить в облако', e)); }, 800);
    return () => clearTimeout(t);
  }, [state, cloud]);
  const update = fn => setState(s => ({ ...fn(s), updatedAt: Date.now() }));
  return { state, setState, update, cloud };
}

          const w = r25(a + (b - a) * p);
          return { id: uid(), name: n, sets: [0, 1, 2].map(j => ({ id: uid(), weight: toInput(w), reps: String(Math.max(3, r - (j === 2 ? 1 + Math.round(Math.random()) : 0))), done: true })) };

  return { ...emptyState(), workouts, templates, updatedAt: Date.now() };

/* ---------- chart ---------- */
function AreaChart({ values, labels, fmt, label }) {
  const gid = 'g' + React.useId().replace(/[^a-zA-Z0-9]/g, '');
  if (values.length < 2 || !values.some(v => v > 0)) return html`<div className="chart-empty">График появится после двух тренировок с записанными подходами</div>`;
  const W = 340, H = 170, top = 28, bottom = 26, sx = 14;
  const max = Math.max(...values), min = Math.min(...values);
  const lo = max > min ? Math.max(0, min - (max - min) * 0.8) : 0; // zoom in so progress is visible
  const x = i => sx + i * (W - sx * 2) / (values.length - 1);
  const y = v => top + (H - top - bottom) * (1 - (v - lo) / (max - lo || 1));
  const pts = values.map((v, i) => [x(i), y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2; d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
  const last = values.length - 1;
  const area = `${d} L${pts[last][0]},${H - bottom} L${pts[0][0]},${H - bottom} Z`;
  const maxI = values.indexOf(max);
  const marks = values[last] === max || last - maxI < 2 ? [last] : [maxI, last];
  const anchor = i => i === last ? 'end' : i === 0 ? 'start' : 'middle';
  const step = Math.max(1, Math.ceil(values.length / 6));
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${label}>
    <defs><linearGradient id=${gid} x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style=${{ stopColor: 'var(--chart)', stopOpacity: 0.42 }}></stop>
      <stop offset="1" style=${{ stopColor: 'var(--chart)', stopOpacity: 0 }}></stop>
    </linearGradient></defs>
    <line x1=${sx} x2=${W - sx} y1=${y(max)} y2=${y(max)} className="chart-guide"></line>
    <path d=${area} fill=${`url(#${gid})`}></path>
    <path d=${d} className="chart-line"></path>
    ${pts.map(([px, py], i) => html`<circle key=${'p' + i} cx=${px} cy=${py} r=${i === last ? 4 : 2.75} className="chart-dot"></circle>`)}
    ${marks.map(i => html`<text key=${'v' + i} x=${pts[i][0] + (i === last ? 4 : 0)} y=${pts[i][1] - 10} textAnchor=${anchor(i)} className="chart-val">${fmt(values[i])}</text>`)}
    ${labels.map((l, i) => ((last - i) % step === 0) ? html`<text key=${'l' + i} x=${x(i)} y=${H - 6} textAnchor=${anchor(i)} className="chart-lbl">${l}</text>` : null)}
  </svg>`;
}

  }, []);
  return html`<div className="backdrop" onClick=${onClose}>

  const recents = [];
  for (let i = index.list.length - 1; i >= 0 && recents.length < 4; i--) {
    const w = index.list[i]; const k = norm(w.name);
    if (!w.exercises.length || seen.has(k)) continue; seen.add(k); recents.push(w);
  }
  const go = (n, src) => { onClose(); onCreate(date, n, src); };
  const names = list => list.map(e => e.name).join(', ');
  return html`<${Sheet} title="Новая тренировка" sub=${dayLabel(date)} onClose=${onClose}>
    <form className="field-row" onSubmit=${e => { e.preventDefault(); if (name.trim()) go(name, []); }}>

    ${recents.length ? html`<p className="label">Повторить</p><div className="list">
      ${recents.map(w => html`<button key=${w.id} className="row" onClick=${() => go(w.name, w.exercises)}>
        <div className="row-main"><div className="row-title">${w.name}</div><div className="row-sub">${names(w.exercises)}</div></div>

function RestTimer({ rest, onAdjust, onClose }) {
  const [now, setNow] = useState(Date.now());
  const buzzed = useRef(false);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(t); }, []);
  const left = rest.endsAt - now, over = left <= 0;
  useEffect(() => {
    if (!over) { buzzed.current = false; return; }
    if (!buzzed.current) { buzzed.current = true; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    const t = setTimeout(onClose, 6000);
    return () => clearTimeout(t);
  }, [over]);
  const pct = Math.min(100, Math.max(0, (1 - left / rest.total) * 100));
  return html`<div className="rest" role="timer" aria-label="Таймер отдыха">
    <div className="rest-bar" style=${{ width: pct + '%' }}></div>
    <span className="rest-label">${over ? 'Пора' : 'Отдых'}</span>
    <span className="rest-time">${over ? 'подход!' : fmtClock(left + 999)}</span>
    <button onClick=${() => onAdjust(-15)} aria-label="Убавить 15 секунд">−15</button>
    <button onClick=${() => onAdjust(15)} aria-label="Добавить 15 секунд">+15</button>
    <button onClick=${onClose} aria-label="Скрыть таймер"><${Icon} n="x" s=${18} /></button>
  </div>`;
}

function Toast({ toast, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, toast.undo ? 6000 : 3000); return () => clearTimeout(t); }, [toast.key]);
  return html`<div className="toast" role="status">
    ${toast.icon ? html`<${Icon} n=${toast.icon} s=${20} />` : null}
    <span>${toast.text}</span>
    ${toast.undo ? html`<button onClick=${() => { toast.undo(); onClose(); }}>Отменить</button>` : null}
  </div>`;
}

function GoalSheet({ goal, onPick, onClose }) {

function Home({ state, index, ui, ctx, cloud, game }) {
  const { selDay, setSelDay, weekStart, setWeekStart } = ui;
  const today = new Date(), tKey = dkey(today);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(weekStart, i));

  const inRange = (a, b) => index.list.filter(w => w.date >= a && w.date <= b);
  const last30 = inRange(dkey(addDays(today, -29)), tKey);
  const prev30 = inRange(dkey(addDays(today, -59)), dkey(addDays(today, -30)));
  const vol30 = sum(last30.map(workoutVolume)), volPrev = sum(prev30.map(workoutVolume));
  const sessions30 = last30.filter(w => workoutSets(w) > 0).length;
  const heaviest30 = Math.max(0, ...last30.flatMap(w => w.exercises.flatMap(e => e.sets.filter(counts).map(s => num(s.weight)))));
  const delta = volPrev > 0 ? Math.round((vol30 - volPrev) / volPrev * 100) : null;
  const ws = startOfWeek(today);
  const weeks = [0, 1, 2, 3, 4, 5, 6, 7].map(i => addDays(ws, -7 * (7 - i)));
  const weekVals = weeks.map(w => sum(inRange(dkey(w), dkey(addDays(w, 6))).map(workoutVolume)));
  const thisWeek = inRange(dkey(ws), dkey(addDays(ws, 6))).filter(w => workoutSets(w) > 0);
  const record = Math.max(0, ...[...index.ex.values()].flatMap(e => e.sessions.map(s => s.maxW)));
  const exercises = [...index.ex.values()].filter(e => e.sessions.some(s => s.sets.length))
    .sort((a, b) => b.sessions[b.sessions.length - 1].order - a.sessions[a.sessions.length - 1].order);
  const [vN, vU] = volParts(vol30);
  const goal = game.goal;
  const nextAch = ACH.filter(a => !game.unlocked.includes(a.id)).sort((a, b) => achValue(b, game) / b.target - achValue(a, game) / a.target)[0];

      </div>
      <div className="week-days">
        ${days.map(d => { const k = dkey(d); const cls = ['day', k === selDay && 'sel', k === tKey && 'today', index.byDate[k] && 'has'].filter(Boolean).join(' ');
          return html`<button key=${k} className=${cls} aria-pressed=${k === selDay} aria-label=${dayLabel(k) + (index.byDate[k] ? ', есть тренировка' : '')} onClick=${() => setSelDay(k)}>
            <span className="wd">${d.toLocaleDateString('ru-RU', { weekday: 'short' })}</span><span className="dn">${d.getDate()}</span><span className="dot"></span>
          </button>`; })}
      </div>
    </section>

    <section className="hero">
      <p className="hero-day">${dayLabel(selDay)}</p>
      ${dayWorkouts.length === 0 ? html`
        <p className="hero-title is-empty">${isFuture ? 'Ничего не запланировано' : 'Нет тренировки'}</p>
        <p className="hero-sub">${isFuture ? 'Можно создать тренировку заранее' : hasData ? 'Повторите прошлую или начните с шаблона' : 'Запишите первую — прогресс начнёт считаться сам'}</p>

          <div className="ring-wrap"><${Ring} value=${game.thisCount} total=${goal} /><span className="ring-n">${game.thisCount}<small>/${goal}</small></span></div>

        <div className="tile"><${Icon} n="trophy" s=${18} /><div className="tile-n">${nf2.format(record)}<small>кг</small></div><div className="tile-l">самый тяжёлый подход</div></div>
      </section>

      <button className="ach-strip" onClick=${() => ctx.setSheet({ type: 'achievements' })}>
        <div className="row-main">
          <div className="row-title">Достижения<span className="muted">${game.unlocked.length} из ${ACH.length}</span></div>
          <div className="row-sub">${nextAch ? `Следующее: ${nextAch.title}, ${achProgress(nextAch, achValue(nextAch, game))}` : 'Открыты все'}</div>
        </div>
        <div className="ach-mini">${game.unlocked.slice(-3).map(id => { const a = ACH.find(x => x.id === id); return a ? html`<span key=${id} className="badge-ic on sm"><${Icon} n=${a.icon} s=${15} /></span>` : null; })}</div>
        <${Icon} n="chevR" s=${16} />

      <section className="summary" aria-label="Последние 30 дней">

        <p className="big-label">общий объём</p>

    <div className="ex-head">
      ${hasHistory
        ? html`<button className="ex-name" onClick=${() => ctx.openExercise(e.name)} aria-label=${e.name + ': открыть прогресс'}>${e.name}<${Icon} n="chart" s=${16} /></button>`

    <div className="ex-foot">
      <button className="link-btn" onClick=${() => ctx.patchExercise(w.id, e.id, x => ({ ...x, sets: [...x.sets, { id: uid(), reps: '', weight: '', done: false }] }))}><${Icon} n="plus" s=${16} />Подход</button>
      ${e.sets.length > 1 ? html`<button className="link-btn quiet" onClick=${() => ctx.patchExercise(w.id, e.id, x => ({ ...x, sets: x.sets.slice(0, -1) }))}>Убрать последний</button>` : null}

function WorkoutScreen({ w, index, ctx }) {

  const vol = workoutVolume(w), sets = workoutSets(w);
  return html`<main className="app">
    <header className="topbar">
      <button className="back" onClick=${ctx.back}><${Icon} n="chevL" />Назад</button>
      <button className="icon-btn" aria-label="Действия с тренировкой" onClick=${() => ctx.setSheet({ type: 'workoutMenu', id: w.id })}><${Icon} n="more" /></button>
    </header>
    <section className="w-head">
      <p className="hero-day">${dayLabel(w.date)}</p>
      <button className="w-title" onClick=${() => ctx.setSheet({ type: 'renameWorkout', id: w.id })} aria-label=${'Переименовать: ' + w.name}>${w.name}</button>
      <div className="pills">
        ${active ? html`<span className="pill live"><${Icon} n="clock" s=${15} /><${Elapsed} since=${w.startedAt} /></span>`
          : w.finishedAt && w.startedAt ? html`<span className="pill"><${Icon} n="clock" s=${15} />${fmtDur(w.finishedAt - w.startedAt)}</span>` : null}
        <span className="pill">${plural(sets, W_SET)}</span>
        ${vol > 0 ? html`<span className="pill"><${Icon} n="weight" s=${15} />${fmtVol(vol)}</span>` : null}
      </div>
    </section>
    ${w.exercises.length === 0 ? html`<div className="empty-card">
      <p className="empty-title">Добавьте первое упражнение</p>
      <p className="muted">Отмечайте подходы галочкой по ходу тренировки. Если поле пустое, подставится значение с прошлого раза, а после отметки запустится таймер отдыха.</p>
    </div>` : null}
    ${w.exercises.map(e => html`<${ExerciseCard} key=${e.id} w=${w} e=${e} index=${index} ctx=${ctx} />`)}
    <button className="btn-secondary" onClick=${() => ctx.setSheet({ type: 'addExercise', id: w.id })}><${Icon} n="plus" />Добавить упражнение</button>
    ${!w.finishedAt && w.exercises.length ? html`<button className="cta" onClick=${() => ctx.finish(w)}><${Icon} n="flag" />Завершить тренировку</button>` : null}
    ${w.finishedAt ? html`<p className="done-note">Тренировка завершена. Подходы можно править.</p>` : null}
  </main>`;
}

const METRICS = {
  maxW: { label: 'Вес', fmt: v => fmtKg(v) },
  e1rm: { label: '1ПМ', fmt: v => fmtKg(Math.round(v * 2) / 2) },
  vol: { label: 'Объём', fmt: v => fmtVol(v) },
};

function ExerciseScreen({ rec, ctx }) {
  const [metric, setMetric] = useState('maxW');
  const ss = rec.sessions.filter(s => s.sets.length);
  const recent = ss.slice(-12);
  const bestW = Math.max(0, ...ss.map(s => s.maxW));
  const bestE = Math.max(0, ...ss.map(s => s.e1rm));
  const delta = recent.length > 1 ? recent[recent.length - 1].maxW - recent[0].maxW : null;
  let run = 0;
  const flagged = ss.map(s => { const pr = run > 0 && s.maxW > run; run = Math.max(run, s.maxW); return { ...s, pr }; }).reverse();
  return html`<main className="app">
    <header className="topbar"><button className="back" onClick=${ctx.back}><${Icon} n="chevL" />Назад</button></header>
    <section className="w-head"><p className="hero-day">${plural(ss.length, W_WO)}</p><h1 className="w-title">${rec.name}</h1></section>
    <section className="summary">
      <p className="label">Лучший вес</p>
      <div className="big"><span className="big-n">${nf2.format(bestW)}</span><span className="big-u">кг</span><${Delta} value=${delta} suffix=" кг" title="Изменение рабочего веса за показанный период" /></div>
      <p className="muted">Расчётный максимум на один повтор — ${METRICS.e1rm.fmt(bestE)}. Считается по формуле Эпли из лучшего подхода.</p>
      <div className="seg" role="tablist" aria-label="Что показать на графике">
        ${Object.entries(METRICS).map(([k, m]) => html`<button key=${k} role="tab" aria-selected=${metric === k} onClick=${() => setMetric(k)}>${m.label}</button>`)}
      </div>
      <div className="chart-card">
        <${AreaChart} values=${recent.map(s => s[metric])} labels=${recent.map(s => fmtShort(fromKey(s.date)))} fmt=${METRICS[metric].fmt} label=${`${METRICS[metric].label}: последние ${recent.length} тренировок`} />
      </div>
    </section>
    <h2 className="sec-title">История</h2>
    <div className="hist">
      ${flagged.map(s => html`<div key=${s.workoutId + s.order} className="hist-item">
        <div className="hist-top">
          <div><div className="hist-date">${dayLabel(s.date)}</div><button className="hist-w" onClick=${() => ctx.openWorkout(s.workoutId)}>${s.workoutName}</button></div>
          ${s.pr ? html`<span className="badge">Рекорд</span>` : null}
        </div>
        <div className="set-chips">${s.sets.map((x, i) => html`<span key=${i} className="set-chip">${x.weight ? nf2.format(x.weight) + ' × ' : ''}${x.reps}</span>`)}</div>
      </div>`)}
    </div>
  </main>`;
}

/* ---------- app ---------- */
function App() {
  const { state, setState, update, cloud } = useStore();
  const index = useMemo(() => buildIndex(state.workouts), [state.workouts]);
  const [stack, setStack] = useState([{ screen: 'home' }]);
  const nav = stack[stack.length - 1];
  const [selDay, setSelDay] = useState(() => dkey(new Date()));
  const [weekStart, setWeekStart] = useState(() => startOfWeek(new Date()));
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const [rest, setRest] = useState(null);
  const [pop, setPop] = useState(null);

  const goal = state.settings.goal || 3;
  const gstats = useMemo(() => gameStats(index, goal), [index, goal]);
  const metNow = ACH.filter(a => achValue(a, gstats) >= a.target).map(a => a.id);
  const seen = state.seenAch;
  const game = { ...gstats, goal, unlocked: seen ? [...seen, ...metNow.filter(id => !seen.includes(id))] : metNow };

  // Announce newly unlocked achievements, but not mid-workout (PR toasts own that moment)
  useEffect(() => {
    if (!seen) { setState(s => ({ ...s, seenAch: metNow })); return; }
    const fresh = metNow.filter(id => !seen.includes(id));
    if (!fresh.length || nav.screen === 'workout') return;
    update(s => ({ ...s, seenAch: [...(s.seenAch || []), ...fresh.filter(id => !(s.seenAch || []).includes(id))] }));
    if (sheet && sheet.type === 'summary') return;
    const a = ACH.find(x => x.id === fresh[fresh.length - 1]);
    showToast(fresh.length > 1 ? `Открыто достижений: ${fresh.length}` : `Достижение: ${a.title}`, null, a.icon);
  }, [metNow.join(','), !!seen, nav.screen]);

  useEffect(() => { if (!pop) return; const t = setTimeout(() => setPop(null), 1300); return () => clearTimeout(t); }, [pop]);

  useEffect(() => { window.scrollTo(0, 0); }, [stack.length, nav.screen, nav.id, nav.key]);

  const push = n => setStack(s => [...s, n]);
  const back = () => setStack(s => s.length > 1 ? s.slice(0, -1) : s);
  const home = () => setStack([{ screen: 'home' }]);
  const showToast = (text, undo, icon) => setToast({ text, undo, icon, key: uid() });

  const patchWorkout = (id, fn) => update(s => s.workouts[id] ? { ...s, workouts: { ...s.workouts, [id]: fn(s.workouts[id]) } } : s);
  const patchExercise = (wid, eid, fn) => patchWorkout(wid, w => ({ ...w, exercises: w.exercises.map(e => e.id === eid ? fn(e) : e) }));
  const patchSet = (wid, eid, sid, fn) => patchExercise(wid, eid, e => ({ ...e, sets: e.sets.map(x => x.id === sid ? fn(x) : x) }));
  const withUndo = (text, fn) => { const before = state; update(fn); showToast(text, () => setState({ ...before, updatedAt: Date.now() })); };

  const createWorkout = (date, name, src) => {
    const id = uid(), isToday = date === dkey(new Date());
    const w = {
      id, date, name: name.trim(), createdAt: Date.now(), startedAt: isToday ? Date.now() : null, finishedAt: null,
      exercises: (src || []).map(e => ({ id: uid(), name: e.name, sets: (e.sets.length ? e.sets : [{}]).map(s => ({ id: uid(), reps: '', weight: '', done: false, hint: num(s.reps) ? { reps: num(s.reps), weight: num(s.weight) } : null })) })),
    };
    update(s => ({ ...s, workouts: { ...s.workouts, [id]: w } }));
    setSelDay(date);
    push({ screen: 'workout', id });
  };

  const ctx = {
    pop, setSheet, back, patchWorkout, patchExercise, patchSet,
    openWorkout: id => push({ screen: 'workout', id }),
    openExercise: name => push({ screen: 'exercise', key: norm(name) }),
    loadDemo: () => withUndo('Добавлены демо-данные за 8 недель', () => demoState()),
    toggleSet: (w, e, s, ph) => {
      if (s.done) return patchSet(w.id, e.id, s.id, x => ({ ...x, done: false }));
      const reps = s.reps || (ph && ph.reps ? String(ph.reps) : '');
      const weight = s.weight || (ph && ph.weight ? toInput(ph.weight) : '');
      if (!num(reps)) { showToast('Сначала введите количество повторений'); return; }
      patchSet(w.id, e.id, s.id, x => ({ ...x, reps, weight, done: true }));
      const wt = num(weight), rp = num(reps), bb = bestBefore(index, e.name, w.id);
      const others = e.sets.filter(x => x.id !== s.id && x.done && counts(x));
      const topW = Math.max(bb.w, ...others.map(x => num(x.weight)));
      const topE = Math.max(bb.e, ...others.map(x => epley(num(x.weight), num(x.reps))));
      if (bb.w > 0 && wt > topW) { showToast(`Новый рекорд: ${e.name}, ${fmtKg(wt)}`, null, 'trophy'); setPop(s.id); }
      else if (bb.e > 0 && wt > 0 && epley(wt, rp) > topE + 0.01) { showToast(`Рекорд по 1ПМ: ${e.name}, ${METRICS.e1rm.fmt(epley(wt, rp))}`, null, 'trophy'); setPop(s.id); }
      if (!w.finishedAt) { const ms = (state.settings.rest || 90) * 1000; setRest({ endsAt: Date.now() + ms, total: ms }); }
    },
    finish: w => {
      const at = Date.now();
      const prs = w.exercises.map(e => {
        const bb = bestBefore(index, e.name, w.id);
        const mx = Math.max(0, ...e.sets.filter(counts).map(x => num(x.weight)));
        return bb.w > 0 && mx > bb.w ? { name: e.name, weight: mx, prev: bb.w } : null;
      }).filter(Boolean);
      patchWorkout(w.id, x => ({ ...x, finishedAt: at }));
      setRest(null); setToast(null); home();
      setSheet({ type: 'summary', data: { name: w.name, vol: workoutVolume(w), sets: workoutSets(w), exercises: w.exercises.length, duration: w.startedAt ? at - w.startedAt : null, prs, seenBefore: seen || [] } });
    },
  };

  const adjustRest = d => {
    setRest(r => r && { endsAt: Math.max(Date.now(), r.endsAt) + d * 1000, total: Math.max(15000, r.total + d * 1000) });
    update(s => ({ ...s, settings: { ...s.settings, rest: Math.max(15, Math.min(600, (s.settings.rest || 90) + d)) } }));
  };

  let screen;
  const curW = nav.screen === 'workout' && state.workouts[nav.id];
  const curE = nav.screen === 'exercise' && index.ex.get(nav.key);
  if (curW) screen = html`<${WorkoutScreen} w=${curW} index=${index} ctx=${ctx} />`;
  else if (curE) screen = html`<${ExerciseScreen} key=${nav.key} rec=${curE} ctx=${ctx} />`;
  else screen = html`<${Home} state=${state} index=${index} ctx=${ctx} cloud=${cloud} game=${game} ui=${{ selDay, setSelDay, weekStart, setWeekStart }} />`;

  const close = () => setSheet(null);
  let sheetEl = null;
  if (sheet) {
    const sw = sheet.id && state.workouts[sheet.id];
    if (sheet.type === 'summary') sheetEl = html`<${SummarySheet} data=${sheet.data} game=${game} onClose=${close} />`;
    else if (sheet.type === 'achievements') sheetEl = html`<${AchievementsSheet} game=${game} onClose=${close} />`;
    else if (sheet.type === 'goal') sheetEl = html`<${GoalSheet} goal=${goal} onClose=${close} onPick=${n => update(s => ({ ...s, settings: { ...s.settings, goal: n } }))} />`;
    else if (sheet.type === 'menu') sheetEl = html`<${ActionSheet} title="Меню" onClose=${close} actions=${[
      { label: 'Цель на неделю', sub: plural(goal, W_WO), onClick: () => setSheet({ type: 'goal' }) },
      { label: 'Достижения', sub: `${game.unlocked.length} из ${ACH.length}`, onClick: () => setSheet({ type: 'achievements' }) },
      { label: 'Шаблоны', sub: plural(Object.keys(state.templates).length, ['шаблон', 'шаблона', 'шаблонов']), onClick: () => setSheet({ type: 'templates' }) },
      { label: 'Заполнить демо-данными', sub: 'Заменит текущие записи, можно отменить', onClick: ctx.loadDemo },
      index.list.length ? { label: 'Удалить все данные', danger: true, onClick: () => { withUndo('Все данные удалены', s => ({ ...emptyState(), settings: s.settings })); home(); } } : null,
    ]} />`;
    else if (sheet.type === 'templates') sheetEl = html`<${TemplatesSheet} state=${state} onClose=${close} onDelete=${t => withUndo(`Шаблон «${t.name}» удалён`, s => { const n = { ...s.templates }; delete n[t.id]; return { ...s, templates: n }; })} />`;
    else if (sheet.type === 'start') sheetEl = html`<${StartSheet} date=${sheet.date} state=${state} index=${index} onClose=${close} onCreate=${createWorkout} />`;
    else if (sheet.type === 'addExercise' && sw) sheetEl = html`<${TextSheet} title="Упражнение" sub=${sw.name} placeholder="Например, жим лёжа" cta="Добавить" onClose=${close}
      suggestions=${[...index.ex.values()].sort((a, b) => b.sessions.length - a.sessions.length).map(e => e.name).filter(n => !sw.exercises.some(x => norm(x.name) === norm(n)))}
      onSubmit=${name => { const p = prevSession(index, name, sw.id); const n = p ? p.sets.length : 3;
        patchWorkout(sw.id, w => ({ ...w, exercises: [...w.exercises, { id: uid(), name, sets: Array.from({ length: n }, () => ({ id: uid(), reps: '', weight: '', done: false })) }] })); }} />`;
    else if (sheet.type === 'renameWorkout' && sw) sheetEl = html`<${TextSheet} title="Название тренировки" initial=${sw.name} cta="Сохранить" onClose=${close} onSubmit=${name => patchWorkout(sw.id, w => ({ ...w, name }))} />`;
    else if (sheet.type === 'saveTemplate' && sw) sheetEl = html`<${TextSheet} title="Сохранить как шаблон" sub=${plural(sw.exercises.length, W_EX)} initial=${sw.name} cta="Сохранить" onClose=${close}
      onSubmit=${name => { const id = uid(); update(s => ({ ...s, templates: { ...s.templates, [id]: { id, name, createdAt: Date.now(), exercises: sw.exercises.map(e => ({ name: e.name, sets: e.sets.map(x => ({ reps: num(x.reps) || (x.hint && x.hint.reps) || 0, weight: num(x.weight) || (x.hint && x.hint.weight) || 0 })) })) } } })); showToast(`Шаблон «${name}» сохранён`); }} />`;
    else if (sheet.type === 'workoutMenu' && sw) sheetEl = html`<${ActionSheet} title=${sw.name} sub=${dayLabel(sw.date)} onClose=${close} actions=${[
      { label: 'Переименовать', onClick: () => setSheet({ type: 'renameWorkout', id: sw.id }) },
      sw.exercises.length ? { label: 'Сохранить как шаблон', onClick: () => setSheet({ type: 'saveTemplate', id: sw.id }) } : null,
      sw.finishedAt ? { label: 'Продолжить тренировку', sub: 'Снять отметку «завершена»', onClick: () => patchWorkout(sw.id, w => ({ ...w, finishedAt: null })) } : null,
      { label: 'Удалить тренировку', danger: true, onClick: () => { withUndo(`Тренировка «${sw.name}» удалена`, s => { const n = { ...s.workouts }; delete n[sw.id]; return { ...s, workouts: n }; }); setRest(null); home(); } },
    ]} />`;
    else if (sheet.type === 'exerciseMenu') {
      const w = state.workouts[sheet.wid]; const e = w && w.exercises.find(x => x.id === sheet.eid);
      const i = w ? w.exercises.indexOf(e) : -1;
      const move = dir => patchWorkout(w.id, x => { const a = [...x.exercises]; [a[i], a[i + dir]] = [a[i + dir], a[i]]; return { ...x, exercises: a }; });
      if (e) sheetEl = html`<${ActionSheet} title=${e.name} onClose=${close} actions=${[
        { label: 'Переименовать', onClick: () => setSheet({ type: 'renameExercise', wid: w.id, eid: e.id }) },
        i > 0 ? { label: 'Переместить выше', onClick: () => move(-1) } : null,
        i < w.exercises.length - 1 ? { label: 'Переместить ниже', onClick: () => move(1) } : null,
        { label: 'Удалить упражнение', danger: true, onClick: () => withUndo(`«${e.name}» удалено`, s => ({ ...s, workouts: { ...s.workouts, [w.id]: { ...s.workouts[w.id], exercises: s.workouts[w.id].exercises.filter(x => x.id !== e.id) } } })) },
      ]} />`;
    }
    else if (sheet.type === 'renameExercise') {
      const w = state.workouts[sheet.wid]; const e = w && w.exercises.find(x => x.id === sheet.eid);
      if (e) sheetEl = html`<${TextSheet} title="Название упражнения" initial=${e.name} cta="Сохранить" onClose=${close}
        suggestions=${[...index.ex.values()].map(x => x.name)} onSubmit=${name => patchExercise(w.id, e.id, x => ({ ...x, name }))} />`;
    }
  }

  return html`<${React.Fragment}>
    ${screen}
    ${sheetEl}
    <div className="dock">
      ${toast ? html`<${Toast} toast=${toast} onClose=${() => setToast(null)} />` : null}
      ${rest ? html`<${RestTimer} rest=${rest} onAdjust=${adjustRest} onClose=${() => setRest(null)} />` : null}
    </div>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
